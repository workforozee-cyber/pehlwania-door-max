<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pehlwania Door Max — POS</title>
<style>
  :root{
    --navy:#1e3157; --navy2:#28406e; --navy3:#12203c;
    --orange:#e07d1c; --orange-l:#f39423; --gold:#e8a33a;
    --bg:#f5f1ea; --card:#ffffff; --line:#e5ded2;
    --ink:#232a36; --muted:#8a8578; --green:#1f8a4c; --red:#c0392b; --blue:#2c6fb3; --purple:#6b4c9a;
    --shadow:0 2px 10px rgba(30,49,87,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--navy2)}
  /* ---------- LOGIN ---------- */
  #loginScreen{position:fixed;inset:0;z-index:150;background:radial-gradient(circle at 50% 30%,var(--navy2),var(--navy3));display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
  .login-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:34px 34px 28px;border-radius:18px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .login-card h2{margin:16px 0 2px;font-size:22px}
  .login-card p{margin:0 0 20px;color:#c7d2e6;font-size:12.5px}
  .login-card input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);color:#fff;margin-bottom:12px;font-size:15px}
  .login-card input::placeholder{color:#a9b6cf}
  .login-card input:focus{outline:none;border-color:var(--orange);background:rgba(255,255,255,.18)}
  .login-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--gold));color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;margin-top:4px}
  .login-btn:hover{filter:brightness(1.06)}
  .login-err{color:#ffb4a8;font-size:12.5px;min-height:16px;margin-top:8px}
  .login-hint{margin-top:18px;font-size:11.5px;color:#93a1bd}
  /* ---------- DOOR ANIMATION ---------- */
  #doorAnim{position:fixed;inset:0;z-index:200;display:none;background:var(--navy3);overflow:hidden}
  #doorAnim .welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:1;opacity:0;transition:opacity .6s .5s}
  #doorAnim.open .welcome{opacity:1}
  #doorAnim .welcome h1{font-size:30px;margin:14px 0 2px;letter-spacing:1px}
  #doorAnim .welcome span{color:var(--orange-l);letter-spacing:3px;font-size:13px;font-weight:700}
  #doorAnim .leaf{position:absolute;top:0;bottom:0;width:50%;z-index:3;transition:transform 1.15s cubic-bezier(.66,0,.34,1);box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
  #doorAnim .leaf .panel{position:absolute;border:3px solid rgba(0,0,0,.28);border-radius:6px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.14))}
  #doorAnim .leaf.l{left:0;transform-origin:left center;background:linear-gradient(90deg,#7a3f16,#a5551f 70%,#b8621f);border-right:4px solid var(--gold)}
  #doorAnim .leaf.r{right:0;transform-origin:right center;background:linear-gradient(-90deg,#7a3f16,#a5551f 70%,#b8621f);border-left:4px solid var(--gold)}
  #doorAnim .leaf .handle{position:absolute;top:50%;width:12px;height:34px;border-radius:6px;background:linear-gradient(var(--gold),#c07d20);transform:translateY(-50%)}
  #doorAnim .leaf.l .handle{right:14px} #doorAnim .leaf.r .handle{left:14px}
  #doorAnim.open .leaf.l{transform:perspective(1600px) rotateY(-108deg)}
  #doorAnim.open .leaf.r{transform:perspective(1600px) rotateY(108deg)}
  /* ---------- APP SHELL (hidden until authed) ---------- */
  .app{display:none;min-height:100vh}
  body.authed .app{display:flex}
  body.authed #loginScreen{display:none}
  .side{width:236px;background:linear-gradient(180deg,var(--navy),var(--navy3));color:#eaf0fa;display:flex;flex-direction:column;position:fixed;height:100vh;top:0;left:0;z-index:10}
  .brand{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;gap:10px;align-items:center}
  .brand h1{font-size:15px;margin:0;line-height:1.05}
  .brand small{color:var(--orange-l);font-size:9.5px;letter-spacing:.6px;font-weight:700}
  .nav{padding:8px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#dce4f2;text-decoration:none;margin-bottom:2px;font-weight:600;font-size:13px;cursor:pointer}
  .nav a .ic{width:18px;text-align:center}
  .nav a:hover{background:rgba(255,255,255,.08)}
  .nav a.active{background:linear-gradient(90deg,var(--orange),var(--gold));color:#241202}
  .side .foot{padding:10px 14px;font-size:10.5px;color:#9fb0cc;border-top:1px solid rgba(255,255,255,.12)}
  .main{margin-left:236px;flex:1;min-width:0}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;gap:10px;flex-wrap:wrap}
  .topbar h2{margin:0;font-size:18px}
  .topbar .sub{color:var(--muted);font-size:12px}
  .topbar .who{font-size:12px;color:var(--muted)}
  .topbar .who b{color:var(--navy)}
  .content{padding:20px 22px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
  .kpi .lbl{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:22px;font-weight:800;margin-top:6px}
  .kpi.green .val{color:var(--green)} .kpi.red .val{color:var(--red)} .kpi.blue .val{color:var(--blue)} .kpi.gold .val{color:var(--orange)} .kpi.navy .val{color:var(--navy)} .kpi.purple .val{color:var(--purple)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel .ph{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .panel .ph h3{margin:0;font-size:15px}
  .panel .pb{padding:15px 17px}
  .btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:8px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--orange)}
  .btn.primary{background:linear-gradient(135deg,var(--orange),var(--gold));border:none;color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.navy{background:var(--navy);color:#fff;border:none}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .btn.danger{color:var(--red);border-color:#eecfcb}
  .btn.danger:hover{background:#fdeceb;border-color:var(--red)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:#faf7f1}
  .right{text-align:right} .center{text-align:center}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.paid{background:#e3f5ea;color:var(--green)}
  .pill.part{background:#fef2e0;color:#b5701a}
  .pill.due{background:#fdeceb;color:var(--red)}
  .pill.quote{background:#e8eff8;color:var(--blue)}
  .pill.stock{background:#eef1ec;color:#5a6b52}
  .pill.low{background:#fdeceb;color:var(--red)}
  .pill.in{background:#e3f5ea;color:var(--green)} .pill.out{background:#fdeceb;color:var(--red)}
  label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
  .inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .inp:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(224,125,28,.15)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .field{margin-bottom:12px}
  .overlay{position:fixed;inset:0;background:rgba(18,32,60,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:28px 16px;overflow:auto}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal.big{max-width:940px}
  .modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{margin:0;font-size:17px}
  .modal .mb{padding:17px 20px;max-height:72vh;overflow:auto}
  .modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#faf7f1;border-radius:0 0 14px 14px;flex-wrap:wrap}
  .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;cursor:pointer}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;bottom:34px}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:38px;margin-bottom:8px}
  .searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .searchbar .inp{max-width:250px}
  .totbox{max-width:340px;margin-left:auto}
  .totrow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
  .totrow.grand{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-size:18px;font-weight:800}
  .totrow.bal{color:var(--red);font-weight:800;font-size:16px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .tag-nav{font-size:10px;background:var(--orange);color:#fff;border-radius:5px;padding:1px 6px;margin-left:auto}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
  .perm-grid label{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 12px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--navy);color:#fff}
  @media(max-width:900px){.side{width:60px}.brand h1,.brand small,.nav a span:not(.ic),.side .foot{display:none}.nav a .ic{width:auto;font-size:18px}.main{margin-left:60px}.grid2,.grid3,.grid4{grid-template-columns:1fr}}
  /* GALLERY */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .gal-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .12s}
  .gal-card:hover{transform:translateY(-3px);border-color:var(--orange)}
  .gal-card .imgwrap{aspect-ratio:3/4;background:#f0ece4;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .gal-card img{width:100%;height:100%;object-fit:cover}
  .gal-card .cap{padding:9px 11px}
  .gal-card .cap b{font-size:13px;display:block}
  .gal-card .cap span{font-size:11px;color:var(--muted)}
  .gal-card .del{position:absolute;top:8px;right:8px;background:rgba(192,57,43,.92);color:#fff;border:none;border-radius:7px;width:28px;height:28px;font-size:15px;opacity:0;transition:.15s}
  .gal-card:hover .del{opacity:1}
  /* LIGHTBOX */
  #lightbox{position:fixed;inset:0;z-index:120;background:rgba(12,20,36,.94);display:none;flex-direction:column;align-items:center;justify-content:center}
  #lightbox.on{display:flex}
  #lightbox img{max-width:88vw;max-height:80vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);object-fit:contain}
  #lightbox .lb-cap{color:#fff;margin-top:16px;font-size:18px;font-weight:700;text-align:center}
  #lightbox .lb-cap small{display:block;color:var(--gold);font-weight:600;font-size:13px;margin-top:3px;letter-spacing:1px}
  #lightbox .lb-x{position:absolute;top:18px;right:24px;color:#fff;font-size:34px;background:none;border:none;cursor:pointer;line-height:1}
  #lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);color:#fff;border:none;font-size:34px;width:58px;height:72px;border-radius:12px;cursor:pointer}
  #lightbox .lb-nav:hover{background:var(--orange)}
  #lightbox .prev{left:22px} #lightbox .next{right:22px}
  #lightbox .lb-tools{position:absolute;bottom:22px;display:flex;gap:10px}
  #lightbox .lb-tools button{background:rgba(255,255,255,.16);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer}
  #lightbox .lb-tools button:hover{background:var(--orange)}
  /* KANBAN */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kcol{background:#efeadf;border-radius:12px;padding:10px;min-height:120px}
  .kcol.drag{outline:2px dashed var(--orange);outline-offset:-4px}
  .kcol h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .kcol h4 .cnt{background:#fff;border-radius:20px;padding:1px 9px;font-size:12px;color:var(--muted)}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:grab}
  .kcard b{font-size:13px} .kcard .meta{font-size:11.5px;color:var(--muted);margin:3px 0 7px}
  .kcard select{width:100%;padding:5px;border:1px solid var(--line);border-radius:7px;font-size:12px}
  .kcard .bal{color:var(--red);font-weight:700;font-size:12px}
  @media(max-width:900px){.kanban{grid-template-columns:1fr 1fr}}
  /* BACKUP & SYNC / status blocks */
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px}
  .kv>div{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .kv b{font-size:13.5px;margin-top:2px;word-break:break-word}
  .alert{border-radius:9px;padding:10px 13px;font-size:13px;margin:8px 0}
  .alert ul{margin:6px 0 0;padding-left:18px}
  .alert.err{background:#fdeceb;color:#8e2a20;border:1px solid #f3c9c4}
  .alert.warn{background:#fef6e8;color:#7a4b0c;border:1px solid #f4dfb8}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .li-table{min-width:760px}
  /* PHONES (Android app) */
  @media(max-width:600px){
    body{font-size:13.5px}
    .side{width:52px}.main{margin-left:52px}.nav{padding:6px 4px}.nav a{padding:10px 0;justify-content:center}.brand{padding:10px 6px;justify-content:center}
    .content{padding:12px 10px}.topbar{padding:9px 12px}.topbar h2{font-size:16px}.topbar .who{display:none}
    .panel .pb{overflow-x:auto}.panel .ph{padding:11px 12px}.panel .pb{padding:12px}
    .cards{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:11px 12px}.kpi .val{font-size:17px}
    .kanban{grid-template-columns:1fr}.totbox{max-width:none;width:100%}
    .login-card{width:min(360px,92vw);padding:26px 20px 22px}
    .modal .mb{max-height:none}.overlay{padding:10px 6px}
    .searchbar .inp{max-width:none}
    td,th{padding:8px 8px}
    .gal-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .gal-card .del{opacity:1}
    #lightbox .lb-nav{width:44px;height:58px}
    .perm-grid{grid-template-columns:1fr}
  }
  /* PRINT */
  #printArea{display:none}
  @media print{ body *{visibility:hidden} #printArea,#printArea *{visibility:visible} #printArea{display:block;position:absolute;left:0;top:0;width:100%} @page{size:A4;margin:13mm} }
  .inv{font-family:"Segoe UI",Arial,sans-serif;color:#1c140c;width:100%}
  .inv-head{display:flex;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:12px;gap:14px}
  .inv-brand{display:flex;gap:12px;align-items:center}
  .inv-brand h1{margin:0;font-size:23px;color:var(--navy)}
  .inv-brand .tag{color:var(--orange);font-weight:800;font-size:11px;letter-spacing:1px}
  .inv-brand .ct{font-size:11.5px;color:#555;margin-top:4px;line-height:1.5}
  .inv-title{text-align:right}
  .inv-title h2{margin:0;font-size:28px;letter-spacing:2px;color:var(--navy)}
  .inv-title .meta{font-size:12px;color:#333;margin-top:8px;line-height:1.7}
  .inv-parties{display:flex;justify-content:space-between;margin:16px 0}
  .inv-parties .box{font-size:12.5px;line-height:1.6}
  .inv-parties .box .h{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--orange);font-weight:800;margin-bottom:4px}
  table.inv-t{width:100%;border-collapse:collapse;margin-top:6px}
  table.inv-t th{background:var(--navy);color:#fff;padding:8px 9px;font-size:11px;letter-spacing:.4px;border:none}
  table.inv-t td{padding:8px 9px;border-bottom:1px solid #e3ddd2;font-size:12.5px;color:#000}
  table.inv-t tr:nth-child(even) td{background:#f7f4ee}
  .inv-tot{display:flex;justify-content:flex-end;margin-top:12px}
  .inv-tot table{width:310px}
  .inv-tot td{padding:5px 10px;font-size:13px}
  .inv-tot .g td{font-size:16px;font-weight:800;border-top:2px solid var(--navy);color:var(--navy)}
  .inv-tot .bd td{color:var(--red);font-weight:800}
  .inv-words{margin-top:10px;font-size:12px;font-style:italic;color:#333}
  .inv-terms{margin-top:14px;font-size:10.5px;color:#666;line-height:1.6}
  .sign{margin-top:34px;display:flex;justify-content:space-between}
  .sign .s{width:200px;border-top:1px solid #333;text-align:center;padding-top:6px;font-size:12px}
  .inv-foot{margin-top:18px;border-top:1px solid #ccc;padding-top:10px;font-size:11px;color:#555;display:flex;justify-content:space-between}
  .lg-badge{width:52px;height:52px;flex:none}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div id="loginLogo"></div>
    <h2>Pehlwania Door Max</h2>
    <p>Point of Sale · Please sign in</p>
    <input id="lg_user" placeholder="Username" autocomplete="off">
    <input id="lg_pass" type="password" placeholder="Password" autocomplete="off">
    <button class="login-btn" onclick="Auth.login()">Sign In</button>
    <div class="login-err" id="lg_err"></div>
    <div class="login-hint" id="lg_hint"></div>
  </div>
</div>

<!-- ================= DOOR ANIMATION ================= -->
<div id="doorAnim">
  <div class="welcome" id="welcomeBox"></div>
  <div class="leaf l"><div class="panel" style="left:22%;top:8%;right:16%;height:34%"></div><div class="panel" style="left:22%;bottom:8%;right:16%;height:34%"></div><div class="handle"></div></div>
  <div class="leaf r"><div class="panel" style="right:22%;top:8%;left:16%;height:34%"></div><div class="panel" style="right:22%;bottom:8%;left:16%;height:34%"></div><div class="handle"></div></div>
</div>

<!-- ================= APP ================= -->
<div class="app">
  <aside class="side">
    <div class="brand" id="sideBrand"></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Offline POS • Data on this PC<br><span id="footDate"></span></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h2 id="pageTitle">Dashboard</h2><div class="sub" id="pageSub"></div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">

/* ---------- Native bridge (Android app) ----------
   In the Android app the page runs inside a WebView and a JavaScript channel
   called "PDMBridge" exists. Every call is {id, method, args}; the app answers by
   calling PDMNative._resolve(id, ok, payload). On desktop (Edge/Chrome) the
   channel does not exist and the app keeps using IndexedDB exactly as before. */
const PDMNative=(()=>{
  const available=!!(window.PDMBridge&&typeof window.PDMBridge.postMessage==='function');
  let seq=0;const pending=new Map();
  function call(method,args){
    if(!available)return Promise.reject(new Error('Not available on this device'));
    return new Promise((res,rej)=>{const id=++seq;pending.set(id,{res,rej});
      window.PDMBridge.postMessage(JSON.stringify({id,method,args:args===undefined?null:args}));});}
  function _resolve(id,ok,payload){const p=pending.get(id);if(!p)return;pending.delete(id);
    if(ok)p.res(payload);else{const e=new Error((payload&&payload.message)||'Native error');e.code=payload&&payload.code;p.rej(e);}}
  return {available,call,_resolve};
})();
window.PDMNative=PDMNative;
const IS_NATIVE=PDMNative.available;

/* ---------- Storage adapter ----------
   Same API as before (open/getAll/get/put/del/clear) plus:
     DB.tx(fn)  – everything written inside fn is committed atomically
                  (one SQLite transaction on Android, one IndexedDB transaction on desktop).
   A read cache avoids re-reading unchanged stores (the gallery holds large images). */
const DB=(()=>{ let db=null; const NAME='pehlwania_pos', VER=4;
  const STORES=['settings','products','customers','documents','counters','users','suppliers','purchases','expenses','fixedexpenses','stockmoves','gallery'];
  const cache={};let buf=null;
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  function open(){
    if(IS_NATIVE)return PDMNative.call('db.open').then(()=>true);
    return new Promise((res,rej)=>{const r=indexedDB.open(NAME,VER);
    r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
    r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e.target.error);});}
  const os=(s,m)=>db.transaction(s,m).objectStore(s);
  function rawGetAll(s){
    if(IS_NATIVE)return PDMNative.call('db.getAll',{store:s});
    return new Promise((res,rej)=>{const q=os(s,'readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
  function rawGet(s,id){
    if(IS_NATIVE)return PDMNative.call('db.get',{store:s,id});
    return new Promise((res,rej)=>{const q=os(s,'readonly').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
  async function getAll(s){
    let rows;
    if(cache[s])rows=clone(cache[s]);else{rows=await rawGetAll(s);cache[s]=clone(rows);}
    if(buf){for(const op of buf){if(op.s!==s)continue;
      if(op.t==='put'){const i=rows.findIndex(r=>r.id===op.v.id);if(i>=0)rows[i]=clone(op.v);else rows.push(clone(op.v));}
      else if(op.t==='del')rows=rows.filter(r=>r.id!==op.id);else if(op.t==='clear')rows=[];}}
    return rows;}
  async function get(s,id){
    if(buf){for(let i=buf.length-1;i>=0;i--){const op=buf[i];if(op.s!==s)continue;
      if(op.t==='put'&&op.v.id===id)return clone(op.v);if(op.t==='del'&&op.id===id)return undefined;if(op.t==='clear')return undefined;}}
    if(cache[s])return clone(cache[s].find(r=>r.id===id));
    return rawGet(s,id);}
  /* commit a list of ops atomically */
  async function commit(ops){
    if(!ops.length)return {};
    for(const op of ops){if(!DB.STORES.includes(op.s))throw new Error('Unknown data store: '+op.s);
      if(op.t==='put'&&(!op.v||typeof op.v.id!=='string'||!op.v.id))throw new Error('Record has no ID ('+op.s+')');}
    ops.forEach(op=>delete cache[op.s]);
    if(IS_NATIVE){const r=await PDMNative.call('db.batch',{ops});ops.forEach(op=>delete cache[op.s]);return r||{};}
    const stores=[...new Set(ops.map(o=>o.s))];
    await new Promise((res,rej)=>{const t=db.transaction(stores,'readwrite');
      t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Transaction aborted'));
      try{for(const op of ops){const st=t.objectStore(op.s);
        if(op.t==='put')st.put(op.v);else if(op.t==='del')st.delete(op.id);else if(op.t==='clear')st.clear();}}
      catch(e){try{t.abort();}catch(_){}rej(e);}});
    ops.forEach(op=>delete cache[op.s]);return {};}
  function stage(op){if(buf){buf.push(op);return Promise.resolve(op.v);}return commit([op]).then(r=>{DB.lastResult=r;return op.v;});}
  const put=(s,v)=>stage({t:'put',s,v:clone(v)}).then(()=>v);
  const del=(s,id)=>stage({t:'del',s,id}).then(()=>undefined);
  const clear=s=>stage({t:'clear',s}).then(()=>undefined);
  async function tx(fn){
    if(buf)return fn();
    buf=[];let r;
    try{r=await fn();}catch(e){buf=null;throw e;}
    const ops=buf;buf=null;
    DB.lastResult=await commit(ops);
    return r;}
  function invalidate(){Object.keys(cache).forEach(k=>delete cache[k]);}
  return {open,getAll,get,put,del,clear,tx,invalidate,STORES,lastResult:null};
})();

/* ---------- helpers ---------- */
/* Stable, collision-resistant record IDs (UUID v4). Older records keep their original IDs. */
const uid=()=>{try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  const b=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=Math.floor(Math.random()*256));
  b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;};
/* Run a multi-step save atomically. On failure nothing is written, the in-memory

  let out='',n=num;const cr=Math.floor(n/10000000);n%=10000000;const lk=Math.floor(n/100000);n%=100000;const th=Math.floor(n/1000);n%=1000;
  if(cr)out+=three(cr)+' Crore ';if(lk)out+=three(lk)+' Lakh ';if(th)out+=three(th)+' Thousand ';if(n)out+=three(n);
  return out.trim().replace(/\s+/g,' ')+' Rupees Only';}

/* ---------- money math ---------- */
/* Area in square feet. Each line remembers its measurement unit:
   'ft' (original behaviour: W ft × H ft) or 'in' (shop spec: W in × H in ÷ 144).
   Lines saved before this option existed have no unit and are feet. */
function lineMU(it){return it.mu==='in'?'in':'ft';}
function lineArea(it){const w=Number(it.width)||0,h=Number(it.height)||0;return lineMU(it)==='in'?(w*h)/144:w*h;}
function sizeText(it){if(!(it.width||it.height))return '-';return `${it.width||'?'}×${it.height||'?'} ${lineMU(it)==='in'?'in':'ft'}`;}
function fmtArea(a){return (Math.round(a*100)/100).toLocaleString('en-PK',{maximumFractionDigits:2});}
function lineAmount(it){const qty=Number(it.qty)||0,rate=Number(it.rate)||0;
  if(it.basis==='sqft'){return rate*lineArea(it)*qty;} return rate*qty;}
function docTotals(doc){
  const sub=(doc.items||[]).reduce((s,it)=>s+lineAmount(it),0);
  const disc=Number(doc.discount)||0;const taxable=Math.max(0,sub-disc);
  const tax=Math.round(taxable*((Number(doc.taxPct)||0)/100));const grand=taxable+tax;
  const paid=(doc.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  return {sub,disc,tax,grand,paid,balance:grand-paid};}
function docStatus(doc){if(doc.type==='quote')return{cls:'quote',label:'Quotation'};const t=docTotals(doc);
  if(t.balance<=0)return{cls:'paid',label:'Paid'};if(t.paid>0)return{cls:'part',label:'Partial'};return{cls:'due',label:'Unpaid'};}
function purchTotals(po){const sub=(po.items||[]).reduce((s,it)=>s+lineAmount(it),0);const disc=Number(po.discount)||0;
  const grand=Math.max(0,sub-disc);const paid=(po.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);return {sub,disc,grand,paid,balance:grand-paid};}
function branchName(id){const b=(State.settings.branches||[]).find(x=>x.id===id);return b?b.name:'';}
function activeBranch(){return State.settings.activeBranchId||(State.settings.branches&&State.settings.branches[0]&&State.settings.branches[0].id)||'';}

Views.dashboard=function(){
  const docs=State.documents.filter(d=>d.type==='invoice');
  const t=todayISO(),mon=t.slice(0,7);
  let todaySales=0,monthSales=0,outstanding=0,recvToday=0;
  docs.forEach(d=>{const tt=docTotals(d);if(d.date===t)todaySales+=tt.grand;if((d.date||'').slice(0,7)===mon)monthSales+=tt.grand;
    outstanding+=Math.max(0,tt.balance);(d.payments||[]).forEach(p=>{if((p.date||'').slice(0,10)===t)recvToday+=Number(p.amount)||0;});});
  const monExp=State.expenses.filter(e=>(e.date||'').slice(0,7)===mon).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const monFixed=fixedCostForRange(mon+'-01',t,'');
  const payable=State.purchases.reduce((s,po)=>s+Math.max(0,purchTotals(po).balance),0);
  const low=State.products.filter(p=>p.stocked&&(Number(p.stock)||0)<=1);
  const recent=[...docs].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,6);
  let html=`<div class="cards">
    <div class="kpi green"><div class="lbl">Today's Sales</div><div class="val">${money(todaySales)}</div></div>
    <div class="kpi blue"><div class="lbl">This Month Sales</div><div class="val">${money(monthSales)}</div></div>
    <div class="kpi gold"><div class="lbl">Received Today</div><div class="val">${money(recvToday)}</div></div>
    <div class="kpi purple"><div class="lbl">This Month Expenses</div><div class="val">${money(monExp)}</div>${monFixed?`<div class="hint">+ ${money(monFixed)} fixed monthly</div>`:''}</div>
    <div class="kpi red"><div class="lbl">Customer Balance Due</div><div class="val">${money(outstanding)}</div></div>
    <div class="kpi navy"><div class="lbl">Payable to Suppliers</div><div class="val">${money(payable)}</div></div>
  </div>`;
  // active orders strip
  if(can('orders')){const oc={};ORDER_STAGES.forEach(s=>oc[s.k]=docs.filter(d=>(d.orderStatus||'pending')===s.k).length);
    html+=`<div class="panel"><div class="ph"><h3>🚚 Active Orders</h3><button class="btn sm" onclick="Nav.go('orders')">Open board</button></div><div class="pb"><div class="chips">${ORDER_STAGES.map(s=>`<span class="chip on" style="cursor:default;background:${s.k==='delivered'?'var(--green)':s.k==='ready'?'var(--blue)':s.k==='process'?'var(--orange)':'var(--navy)'}">${s.label}: ${oc[s.k]}</span>`).join('')}</div></div></div>`;}
  if(can('gallery'))html+=`<div class="panel"><div class="pb" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><b>🎨 Design Showcase</b><div class="hint">Show your door, kitchen & ceiling designs to walk-in customers.</div></div><div><button class="btn" onclick="Nav.go('gallery')">Open Gallery</button> <button class="btn navy" onclick="Nav.go('gallery');setTimeout(Views.slideshow,150)">▶ Start Slideshow</button></div></div></div>`;
  html+=`<div class="panel"><div class="ph"><h3>Recent Invoices</h3>${can('invoices')?`<button class="btn sm" onclick="Nav.go('invoices')">View all</button>`:''}</div><div class="pb" style="padding:0">`;
  if(!recent.length)html+=`<div class="empty"><div class="big">🧾</div>No sales yet.${can('sales')?' Click <b>New Sale</b> to begin.':''}</div>`;
  else{html+=`<table><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Branch</th><th class="right">Total</th><th class="right">Balance</th><th class="center">Status</th></tr></thead><tbody>`;
    recent.forEach(d=>{const tt=docTotals(d),st=docStatus(d);html+=`<tr style="cursor:pointer" onclick="Views.viewDoc('${d.id}')"><td><b>${esc(d.no)}</b></td><td>${fmtDate(d.date)}</td><td>${esc(d.customerName||'Walk-in')}</td><td class="muted">${esc(branchName(d.branchId))}</td><td class="right">${money(tt.grand)}</td><td class="right">${tt.balance>0?money(tt.balance):'-'}</td><td class="center"><span class="pill ${st.cls}">${st.label}</span></td></tr>`;});
    html+=`</tbody></table>`;}
  html+=`</div></div>`;
  if(low.length&&can('inventory')){html+=`<div class="panel"><div class="ph"><h3>⚠ Low / Out of Stock</h3><button class="btn sm" onclick="Nav.go('inventory')">Manage</button></div><div class="pb" style="padding:0"><table><thead><tr><th>Product</th><th>Category</th><th class="center">In Stock</th></tr></thead><tbody>`;
    low.forEach(p=>{html+=`<tr><td>${esc(p.name)}</td><td class="muted">${esc(p.category)}</td><td class="center"><span class="pill ${(Number(p.stock)||0)<=0?'low':'part'}">${Number(p.stock)||0}</span></td></tr>`;});
    html+=`</tbody></table></div></div>`;}
  $('#content').innerHTML=html;
};

Views.saveProduct=async function(id){
  const name=$('#f_name').value.trim();if(!name){toast('Enter a product name');return;}
  const stocked=$('#f_stocked').value==='1';const unit=$('#f_unit').value.trim()||'piece';
  const prev=id?State.products.find(x=>x.id===id):null;
  const price=Number($('#f_price').value)||0;if(price<0){toast('Rate cannot be negative');return;}
  const rec={...(prev||{}),id:id||uid(),name,category:$('#f_cat').value.trim()||'Other',unit,price,stocked,
    stock:stocked?(Number($('#f_stock').value)||0):0,defaultBasis:unit==='sq ft'?'sqft':'piece',createdAt:prev?.createdAt||Date.now(),updatedAt:Date.now()};
  /* Rate Master history: every rate change is kept. Existing invoices keep their own agreed rate. */
  rec.rateHistory=(prev&&prev.rateHistory||[]).slice();
  if(!prev||Number(prev.price||0)!==price)rec.rateHistory.push({price,at:new Date().toISOString(),by:State.currentUser?.username||''});
  if(!await saveAtomic(()=>DB.put('products',rec)))return;
  await loadAll();Modal.close();Views.products();toast(savedMsg('Product'));
};
Views.delProduct=async function(id){if(!confirm('Delete this product? (Past invoices are not affected.)'))return;if(!await saveAtomic(()=>DB.del('products',id)))return;await loadAll();Views.renderProducts();toast('Product deleted');};

Views.saveDoc=async function(print){
  if(Views._saving)return; /* ignore double taps: prevents duplicate invoices */
  const d=Views._draft;d.items=d.items.filter(it=>it.desc&&(Number(it.qty)||0)>0);
  if(!d.items.length){toast('Add at least one item');return;}
  const bad=d.items.find(it=>(Number(it.rate)||0)<0||(Number(it.qty)||0)<0||(Number(it.width)||0)<0||(Number(it.height)||0)<0);
  if(bad){toast('Rate, quantity and sizes cannot be negative');return;}
  if((Number(d.discount)||0)<0){toast('Discount cannot be negative');return;}
  if(!d.customerName)d.customerName=$('#s_cname')?.value.trim()||(d.customerId?State.customers.find(c=>c.id===d.customerId)?.name:'')||'Walk-in';
  const snap=JSON.stringify(d); /* restore the draft exactly if the save fails */
  Views._saving=true;
  const ok=await saveAtomic(async()=>{
    d.items.forEach((it,i)=>{if(!it.id)it.id=uid();it.mu=lineMU(it);it.line=i+1;});
    if(!d.no){d.no=await nextNo(d.type);d.createdAt=Date.now();d.id=uid();}
    if(d.type==='invoice'&&!d.orderStatus){d.orderStatus='pending';d.statusLog=[{status:'pending',date:todayISO()}];}
    if(d.type==='quote')d.payments=[];else d.payments=(d.payments||[]).filter(p=>(Number(p.amount)||0)>0).map(p=>({...p,id:p.id||uid()}));
    if(d.type==='invoice'&&!d._stockApplied){for(const it of d.items){if(it.productId){const p=State.products.find(x=>x.id===it.productId);if(p&&p.stocked){await adjustStock(p.id,-(Number(it.qty)||0));await addMove(p.id,'out',Number(it.qty)||0,'Sale',d.no);}}}d._stockApplied=true;}
    await DB.put('documents',d);
  });
  Views._saving=false;
  if(!ok){Views._draft=JSON.parse(snap);Views.renderSale();return;}
  await loadAll();toast(savedMsg((d.type==='quote'?'Quotation ':'Invoice ')+d.no));
  if(print)Print.doc(d.id);
  Nav.go(d.type==='quote'?'quotes':'invoices');
};

Views.viewDoc=function(id){const d=State.documents.find(x=>x.id===id);if(!d)return;const tt=docTotals(d),st=docStatus(d);

    ${d.type==='invoice'&&tt.balance>0?`<button class="btn" onclick="Views.waReminder('${d.id}')">💬 WhatsApp reminder</button>`:''}

Views.addPayment=function(id){Views._payKey=null;const d=State.documents.find(x=>x.id===id);const tt=docTotals(d);if(tt.balance<=0){toast('Already fully paid');return;}
  Modal.open(`<div class="mh"><h3>Add Payment — ${esc(d.no)}</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><p class="muted">Balance due: <b style="color:var(--red)">${money(tt.balance)}</b></p>

    <div class="field"><label class="fl">Date</label><input class="inp" type="date" id="p_date" value="${todayISO()}"></div>
    <div class="field"><label class="fl">Method / note</label><input class="inp" id="p_method" value="cash"></div></div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.savePayment('${id}')">Save Payment</button></div>`);};
Views.savePayment=async function(id){if(Views._saving)return;const d0=State.documents.find(x=>x.id===id);const amt=Number($('#p_amt').value)||0;if(amt<=0){toast('Enter an amount');return;}
  /* Each payment is its own record with a stable ID, so retries and sync can never double-count it. */
  const pay={id:Views._payKey||uid(),amount:amt,date:$('#p_date').value||todayISO(),method:$('#p_method').value.trim()||'cash',createdAt:Date.now()};
  Views._payKey=pay.id;Views._saving=true;
  const d=JSON.parse(JSON.stringify(d0));d.payments=d.payments||[];
  if(!d.payments.some(p=>p.id===pay.id))d.payments.push(pay);
  const ok=await saveAtomic(()=>DB.put('documents',d));Views._saving=false;if(!ok)return;
  Views._payKey=null;await loadAll();Modal.close();if($('#dList'))Views.renderDocs('invoice');toast(savedMsg('Payment'));};
Views.convertQuote=async function(id){if(Views._saving)return;const q=State.documents.find(x=>x.id===id);if(!confirm('Create an invoice from this quotation?'))return;
  let inv;Views._saving=true;
  const ok=await saveAtomic(async()=>{
    inv={...JSON.parse(JSON.stringify(q)),id:uid(),type:'invoice',no:await nextNo('invoice'),createdAt:Date.now(),payments:[],_stockApplied:false,fromQuote:q.no,orderStatus:'pending',statusLog:[{status:'pending',date:todayISO()}]};
    inv.items=inv.items.map(it=>({...it,id:uid()})); /* item IDs are unique per document */
    for(const it of inv.items){if(it.productId){const p=State.products.find(x=>x.id===it.productId);if(p&&p.stocked){await adjustStock(p.id,-(Number(it.qty)||0));await addMove(p.id,'out',Number(it.qty)||0,'Sale',inv.no);}}}
    inv._stockApplied=true;await DB.put('documents',inv);});
  Views._saving=false;if(!ok)return;
  await loadAll();Modal.close();Nav.go('invoices');toast(savedMsg('Invoice '+inv.no));};
Views.delDoc=async function(id){const d=State.documents.find(x=>x.id===id);
  const paid=docTotals(d).paid;
  if(!confirm('Delete '+d.no+'? This cannot be undone.'+(paid>0?`\n\nThis invoice has ${money(paid)} in recorded payments, which will also be removed. (On Android the deletion is kept in the audit log.)`:'')))return;
  const ok=await saveAtomic(async()=>{
    if(d.type==='invoice'&&d._stockApplied){for(const it of d.items){if(it.productId){const p=State.products.find(x=>x.id===it.productId);if(p&&p.stocked){await adjustStock(p.id,(Number(it.qty)||0));await addMove(p.id,'in',Number(it.qty)||0,'Sale reversed',d.no);}}}}
    await DB.del('documents',id);});
  if(!ok)return;await loadAll();Modal.close();Nav.go(d.type==='quote'?'quotes':'invoices');toast(d.no+' deleted');};

Views.stockMove=function(type,pid){

Views.saveMove=async function(type){const pid=$('#m_prod').value,qty=Number($('#m_qty').value)||0;if(qty<=0){toast('Enter quantity');return;}
  const p=State.products.find(x=>x.id===pid);if(!p)return;

  <div class="mb"><div class="field"><label class="fl">Supplier name</label><input class="inp" id="su_name" value="${esc(s.name)}"></div>
  <div class="field"><label class="fl">Phone</label><input class="inp" id="su_phone" value="${esc(s.phone||'')}"></div>
  <div class="field"><label class="fl">Address</label><textarea class="inp" id="su_addr" rows="2">${esc(s.address||'')}</textarea></div></div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.saveSupplier('${id||''}')">Save</button></div>`);};
Views.saveSupplier=async function(id){const name=$('#su_name').value.trim();if(!name){toast('Enter a name');return;}
  const prev=id?State.suppliers.find(x=>x.id===id):null;
  const rec={id:id||uid(),name,phone:$('#su_phone').value.trim(),address:$('#su_addr').value.trim(),createdAt:prev?.createdAt||Date.now()};
  if(!await saveAtomic(()=>DB.put('suppliers',rec)))return null;
  await loadAll();Modal.close();if($('#supList'))Views.renderSuppliers();toast(savedMsg('Supplier'));return rec;};
Views.supplierDetail=function(id){const s=State.suppliers.find(x=>x.id===id);const pos=State.purchases.filter(p=>p.supplierId===id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const pay=pos.reduce((a,p)=>a+Math.max(0,purchTotals(p).balance),0);const total=pos.reduce((a,p)=>a+purchTotals(p).grand,0);
  const rows=pos.map(p=>{const t=purchTotals(p);return `<tr style="cursor:pointer" onclick="Views.viewPurchase('${p.id}')"><td><b>${esc(p.no)}</b></td><td>${fmtDate(p.date)}</td><td class="right">${money(t.grand)}</td><td class="right">${money(t.paid)}</td><td class="right">${t.balance>0?money(t.balance):'-'}</td></tr>`;}).join('');
  Modal.open(`<div class="mh"><h3>${esc(s.name)}</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><p class="muted" style="margin:0 0 12px">📞 ${esc(s.phone||'—')} ${s.address?'· '+esc(s.address):''}</p>
    <div class="cards" style="margin-bottom:14px"><div class="kpi navy"><div class="lbl">Total Purchased</div><div class="val">${money(total)}</div></div><div class="kpi red"><div class="lbl">Payable Now</div><div class="val">${money(pay)}</div></div></div>
    ${pos.length?`<table><thead><tr><th>Bill</th><th>Date</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Balance</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">No purchase bills yet.</div>'}</div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Close</button><button class="btn primary" onclick="Modal.close();Views.newPurchase('${id}')">＋ New Purchase Bill</button></div>`,true);};

Views.purchases=function(){
  $('#content').innerHTML=`<div class="panel"><div class="ph"><div class="searchbar"><input class="inp" id="poSearch" placeholder="Search bill or supplier..." oninput="Views.renderPurchases()"><input class="inp" type="date" id="poFrom" style="width:150px" onchange="Views.renderPurchases()"><input class="inp" type="date" id="poTo" style="width:150px" onchange="Views.renderPurchases()"></div><button class="btn primary" onclick="Views.newPurchase()">＋ New Purchase Bill</button></div><div class="pb" style="padding:0" id="poList"></div></div>`;
  Views.renderPurchases();
};
Views.renderPurchases=function(){
  const q=($('#poSearch')?.value||'').toLowerCase(),from=$('#poFrom')?.value||'',to=$('#poTo')?.value||'';
  let list=State.purchases.filter(p=>(!q||(p.no||'').toLowerCase().includes(q)||(p.supplierName||'').toLowerCase().includes(q))&&(!from||p.date>=from)&&(!to||p.date<=to)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!list.length){$('#poList').innerHTML=`<div class="empty"><div class="big">🧮</div>No purchase bills yet.</div>`;return;}
  let html=`<table><thead><tr><th>Bill</th><th>Date</th><th>Supplier</th><th class="center">Pieces</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Balance</th><th class="right">Actions</th></tr></thead><tbody>`;
  list.forEach(p=>{const t=purchTotals(p);const pcs=(p.items||[]).reduce((a,it)=>a+(Number(it.qty)||0),0);
    html+=`<tr><td style="cursor:pointer" onclick="Views.viewPurchase('${p.id}')"><b>${esc(p.no)}</b></td><td>${fmtDate(p.date)}</td><td>${esc(p.supplierName||'')}</td><td class="center">${pcs}</td><td class="right">${money(t.grand)}</td><td class="right">${money(t.paid)}</td><td class="right">${t.balance>0?`<span style="color:var(--red);font-weight:700">${money(t.balance)}</span>`:'-'}</td><td class="right"><button class="btn sm" onclick="Views.paySupplier('${p.id}')">＋ Pay</button> <button class="btn sm" onclick="Views.viewPurchase('${p.id}')">View</button></td></tr>`;});
  html+=`</tbody></table>`;$('#poList').innerHTML=html;
};
Views.newPurchase=function(supplierId){

};

    <div class="field"><label class="fl">Supplier</label><select class="inp" id="po_sup" onchange="Views._po.supplierId=this.value"><option value="">— select —</option>${supOpts}</select><div class="hint"><a href="#" onclick="Views.quickSupplier();return false;">＋ Add supplier</a></div></div>
    <div class="field"><label class="fl">Branch</label><select class="inp" onchange="Views._po.branchId=this.value">${branchOptions(po.branchId)}</select></div>
    <div class="field"><label class="fl">Date</label><input class="inp" type="date" value="${po.date}" onchange="Views._po.date=this.value"></div></div>
    <table><thead><tr><th>Item (links to stock if name matches)</th><th class="right">Pieces</th><th class="right">Cost/pc</th><th class="right">Amount</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <button class="btn sm" onclick="Views.poAdd()" style="margin-top:8px">＋ Add item</button>

      <div class="totrow"><span>Subtotal</span><span>${money(t.sub)}</span></div>
      <div class="totrow"><span>Discount</span><span><input class="inp right" type="number" style="width:120px;padding:5px 8px" value="${po.discount||0}" onchange="Views._po.discount=Number(this.value)||0;Views.renderPurchase()"></span></div>
      <div class="totrow grand"><span>Bill Total</span><span>${money(t.grand)}</span></div>
      <div class="totrow"><span>Paid now</span><span><input class="inp right" type="number" style="width:120px;padding:5px 8px" value="${po.payments[0]?.amount||0}" onchange="Views._po.payments=[{amount:Number(this.value)||0,date:todayISO(),method:'cash'}];Views.renderPurchase()"></span></div>

Views.poItem=function(i,k,v){const it=Views._po.items[i];it[k]=(k==='qty'||k==='rate')?(Number(v)||0):v;
  if(k==='desc'){const p=State.products.find(x=>x.name.toLowerCase()===v.toLowerCase());if(p){it.productId=p.id;it.unit=p.unit;}else it.productId='';}Views.renderPurchase();};
Views.poAdd=function(){Views._po.items.push({desc:'',productId:'',qty:1,rate:0,basis:'piece'});Views.renderPurchase();};
Views.poDel=function(i){Views._po.items.splice(i,1);if(!Views._po.items.length)Views._po.items.push({desc:'',productId:'',qty:1,rate:0,basis:'piece'});Views.renderPurchase();};
Views.quickSupplier=function(){Views.editSupplier();$('#modal .mf').innerHTML=`<button class="btn" onclick="Views.renderPurchase()">Back</button><button class="btn primary" onclick="Views.quickSupplierSave()">Save & Select</button>`;};
Views.quickSupplierSave=async function(){const rec=await Views.saveSupplier('');if(rec){Views._po.supplierId=rec.id;Views.renderPurchase();}};
Views.savePurchase=async function(){if(Views._saving)return;const po=Views._po;po.items=po.items.filter(it=>it.desc&&(Number(it.qty)||0)>0);
  if(!po.supplierId){toast('Select a supplier');return;}if(!po.items.length){toast('Add at least one item');return;}
  if(po.items.some(it=>(Number(it.rate)||0)<0)){toast('Cost cannot be negative');return;}
  const snap=JSON.stringify(po);Views._saving=true;
  const ok=await saveAtomic(async()=>{
    po.supplierName=State.suppliers.find(s=>s.id===po.supplierId)?.name||'';po.no=await nextNo('purchase');po.id=uid();po.createdAt=Date.now();
    po.items.forEach((it,i)=>{it.id=it.id||uid();it.line=i+1;});
    po.payments=(po.payments||[]).filter(p=>(Number(p.amount)||0)>0).map(p=>({...p,id:p.id||uid()}));
    for(const it of po.items){if(it.productId){const p=State.products.find(x=>x.id===it.productId);if(p&&p.stocked){await adjustStock(p.id,(Number(it.qty)||0));await addMove(p.id,'in',Number(it.qty)||0,'Purchase',po.no);}}}
    po._stockApplied=true;await DB.put('purchases',po);});
  Views._saving=false;if(!ok){Views._po=JSON.parse(snap);return;}
  await loadAll();Modal.close();Nav.go('purchases');toast(savedMsg('Purchase bill '+po.no));};
Views.viewPurchase=function(id){const po=State.purchases.find(x=>x.id===id);const t=purchTotals(po);
  const items=(po.items||[]).map(it=>`<tr><td>${esc(it.desc)}</td><td class="right">${it.qty}</td><td class="right">${money(it.rate)}</td><td class="right">${money((Number(it.qty)||0)*(Number(it.rate)||0))}</td></tr>`).join('');
  const pays=(po.payments||[]).map(p=>`<tr><td>${fmtDate((p.date||'').slice(0,10))}</td><td class="muted">${esc(p.method||'')}</td><td class="right">${money(p.amount)}</td></tr>`).join('');
  Modal.open(`<div class="mh"><h3>${esc(po.no)} — ${esc(po.supplierName||'')}</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><p class="muted" style="margin:0 0 12px">${fmtDate(po.date)} · ${esc(branchName(po.branchId))} ${po.note?'· '+esc(po.note):''}</p>
    <table><thead><tr><th>Item</th><th class="right">Pieces</th><th class="right">Cost/pc</th><th class="right">Amount</th></tr></thead><tbody>${items}</tbody></table>
    <div class="totbox" style="margin-top:12px"><div class="totrow"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.disc?`<div class="totrow"><span>Discount</span><span>- ${money(t.disc)}</span></div>`:''}<div class="totrow grand"><span>Total</span><span>${money(t.grand)}</span></div><div class="totrow"><span>Paid</span><span>${money(t.paid)}</span></div><div class="totrow bal"><span>Payable</span><span>${money(t.balance)}</span></div></div>
    ${pays?`<h4 style="margin:16px 0 6px">Payments</h4><table><tbody>${pays}</tbody></table>`:''}</div>
  <div class="mf"><button class="btn danger" onclick="Views.delPurchase('${po.id}')">Delete</button><button class="btn primary" onclick="Views.paySupplier('${po.id}')">Add Payment</button></div>`,true);};
Views.paySupplier=function(id){const po=State.purchases.find(x=>x.id===id);const t=purchTotals(po);if(t.balance<=0){toast('Already fully paid');return;}
  Modal.open(`<div class="mh"><h3>Pay Supplier — ${esc(po.no)}</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><p class="muted">Payable: <b style="color:var(--red)">${money(t.balance)}</b></p>
    <div class="field"><label class="fl">Amount paid</label><input class="inp" type="number" id="sp_amt" value="${t.balance}"></div>
    <div class="field"><label class="fl">Date</label><input class="inp" type="date" id="sp_date" value="${todayISO()}"></div></div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.saveSupplierPay('${id}')">Save</button></div>`);};
Views.saveSupplierPay=async function(id){const po=State.purchases.find(x=>x.id===id);const amt=Number($('#sp_amt').value)||0;if(amt<=0){toast('Enter amount');return;}
  if(Views._saving)return;Views._saving=true;const po2=JSON.parse(JSON.stringify(po));po2.payments=po2.payments||[];
  po2.payments.push({id:uid(),amount:amt,date:$('#sp_date').value||todayISO(),method:'cash',createdAt:Date.now()});
  const ok=await saveAtomic(()=>DB.put('purchases',po2));Views._saving=false;if(!ok)return;
  await loadAll();Modal.close();if($('#poList'))Views.renderPurchases();toast(savedMsg('Supplier payment'));};
Views.delPurchase=async function(id){const po=State.purchases.find(x=>x.id===id);if(!confirm('Delete '+po.no+'?'))return;
  const ok=await saveAtomic(async()=>{
    if(po._stockApplied){for(const it of po.items){if(it.productId){const p=State.products.find(x=>x.id===it.productId);if(p&&p.stocked){await adjustStock(p.id,-(Number(it.qty)||0));await addMove(p.id,'out',Number(it.qty)||0,'Purchase reversed',po.no);}}}}
    await DB.del('purchases',id);});
  if(!ok)return;await loadAll();Modal.close();Nav.go('purchases');toast(po.no+' deleted');};

const EXPENSE_CATS=['Labor / Mazdoori','Suzuki Transport / Fuel','Bijli Ka Bill','Chaye / Khana','Raw Material Purchase','Rent','Utilities (bills)','Salaries','Transport / Delivery','Raw material','Tools','Marketing','Tea / Food','Repairs','Misc'];
Views.expenses=function(){
  $('#content').innerHTML=`<div class="panel"><div class="ph"><h3>💸 Daily Expenses</h3><div class="searchbar"><input class="inp" type="date" id="eFrom" style="width:150px" value="${todayISO().slice(0,8)}01" onchange="Views.renderExpenses()"><input class="inp" type="date" id="eTo" style="width:150px" value="${todayISO()}" onchange="Views.renderExpenses()"></div><button class="btn primary" onclick="Views.editExpense()">＋ Add Expense</button></div><div class="pb scroll-x" id="eOut"></div></div>
  <div class="panel"><div class="ph"><h3>📅 Fixed Monthly Expenses</h3><button class="btn primary" onclick="Views.editFixed()">＋ Add Fixed Expense</button></div><div class="pb scroll-x" id="fxOut"></div></div>`;
  Views.renderExpenses();Views.renderFixed();
};
/* ---------- fixed monthly expenses (rent, salaries, bills that repeat every month) ---------- */
function monthsBetween(a,b){/* inclusive count of YYYY-MM months */const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by-ay)*12+(bm-am)+1;}
function fixedCostForRange(from,to,branch){/* sum of active fixed expenses for each calendar month touched by [from,to] */
  if(!from||!to||from>to)return 0;let total=0;const f=from.slice(0,7),t=to.slice(0,7);
  for(const fx of State.fixedexpenses){if(fx.active===false)continue;if(branch&&fx.branchId&&fx.branchId!==branch)continue;
    const s0=fx.startMonth&&fx.startMonth>f?fx.startMonth:f;const e0=fx.endMonth&&fx.endMonth<t?fx.endMonth:t;
    if(s0>e0)continue;total+=(Number(fx.amount)||0)*monthsBetween(s0,e0);}
  return total;}
Views.renderFixed=function(){if(!$('#fxOut'))return;
  const list=[...State.fixedexpenses].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const monthly=list.filter(f=>f.active!==false).reduce((s,f)=>s+(Number(f.amount)||0),0);
  let html=`<div class="cards"><div class="kpi purple"><div class="lbl">Fixed cost per month (active)</div><div class="val">${money(monthly)}</div></div></div>`;
  if(!list.length)html+=`<div class="empty"><div class="big">📅</div>No fixed monthly expenses yet (e.g. shop rent, salaries).</div>`;
  else{html+=`<table><thead><tr><th>Name</th><th>Category</th><th>Branch</th><th>From</th><th>Until</th><th class="center">Status</th><th class="right">Per month</th><th></th></tr></thead><tbody>`;
    list.forEach(f=>{html+=`<tr><td><b>${esc(f.name)}</b>${f.note?`<div class="hint">${esc(f.note)}</div>`:''}</td><td class="muted">${esc(f.category||'')}</td><td class="muted">${esc(branchName(f.branchId)||'All')}</td><td>${esc(f.startMonth||'-')}</td><td>${esc(f.endMonth||'—')}</td><td class="center"><span class="pill ${f.active!==false?'paid':'due'}">${f.active!==false?'Active':'Stopped'}</span></td><td class="right">${money(f.amount)}</td><td class="right"><button class="btn sm" onclick="Views.editFixed('${f.id}')">Edit</button> <button class="btn sm danger" onclick="Views.delFixed('${f.id}')">×</button></td></tr>`;});
    html+=`</tbody></table>`;}
  $('#fxOut').innerHTML=html;};
Views.editFixed=function(id){const f=id?State.fixedexpenses.find(x=>x.id===id):{name:'',category:'Rent',amount:0,branchId:'',active:true,startMonth:todayISO().slice(0,7),endMonth:'',note:''};
  Modal.open(`<div class="mh"><h3>${id?'Edit':'Add'} Fixed Monthly Expense</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><div class="grid2"><div class="field"><label class="fl">Name</label><input class="inp" id="fx_name" value="${esc(f.name)}" placeholder="e.g. Shop rent"></div>
    <div class="field"><label class="fl">Amount per month</label><input class="inp" type="number" id="fx_amt" value="${f.amount||0}"></div></div>
    <div class="grid2"><div class="field"><label class="fl">Category</label><input class="inp" id="fx_cat" list="excat" value="${esc(f.category||'')}"><datalist id="excat">${EXPENSE_CATS.map(c=>`<option>${c}</option>`).join('')}</datalist></div>
    <div class="field"><label class="fl">Branch</label><select class="inp" id="fx_branch"><option value="">All branches</option>${branchOptions(f.branchId)}</select></div></div>
    <div class="grid3"><div class="field"><label class="fl">Starts (month)</label><input class="inp" type="month" id="fx_start" value="${esc(f.startMonth||'')}"></div>
    <div class="field"><label class="fl">Ends (optional)</label><input class="inp" type="month" id="fx_end" value="${esc(f.endMonth||'')}"></div>
    <div class="field"><label class="fl">Status</label><select class="inp" id="fx_active"><option value="1" ${f.active!==false?'selected':''}>Active</option><option value="0" ${f.active===false?'selected':''}>Stopped</option></select></div></div>
    <div class="field"><label class="fl">Note</label><input class="inp" id="fx_note" value="${esc(f.note||'')}"></div></div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.saveFixed('${id||''}')">Save</button></div>`);};
Views.saveFixed=async function(id){const name=$('#fx_name').value.trim();const amt=Number($('#fx_amt').value);
  if(!name){toast('Enter a name');return;}if(!(amt>=0)){toast('Enter a valid amount');return;}
  const start=$('#fx_start').value,end=$('#fx_end').value;if(start&&end&&end<start){toast('End month is before start month');return;}
  const prev=id?State.fixedexpenses.find(x=>x.id===id):null;
  const rec={...(prev||{}),id:id||uid(),name,amount:amt,category:$('#fx_cat').value.trim()||'Other',branchId:$('#fx_branch').value,startMonth:start,endMonth:end,active:$('#fx_active').value==='1',note:$('#fx_note').value.trim(),createdAt:prev?.createdAt||Date.now(),updatedAt:Date.now()};
  if(!await saveAtomic(()=>DB.put('fixedexpenses',rec)))return;await loadAll();Modal.close();Views.renderFixed();toast(savedMsg('Fixed expense'));};
Views.delFixed=async function(id){if(!confirm('Delete this fixed expense? (Tip: set it to "Stopped" instead to keep its history in reports.)'))return;
  if(!await saveAtomic(()=>DB.del('fixedexpenses',id)))return;await loadAll();Views.renderFixed();toast('Deleted');};
Views.renderExpenses=function(){if(!$('#eOut'))return;
  const from=$('#eFrom')?.value||'',to=$('#eTo')?.value||'';
  let list=State.expenses.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to)).sort((a,b)=>b.date.localeCompare(a.date));
  const total=list.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const byCat={};list.forEach(e=>byCat[e.category||'Other']=(byCat[e.category||'Other']||0)+(Number(e.amount)||0));
  let html=`<div class="cards"><div class="kpi red"><div class="lbl">Total Expenses (range)</div><div class="val">${money(total)}</div></div>${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`<div class="kpi navy"><div class="lbl">${esc(k)}</div><div class="val">${money(v)}</div></div>`).join('')}</div>`;
  if(!list.length)html+=`<div class="empty"><div class="big">💸</div>No expenses in this range.</div>`;

Views.reports=function(){
  const first=todayISO().slice(0,8)+'01';
  $('#content').innerHTML=`<div class="panel"><div class="ph"><h3>Business Report</h3>
    <div class="searchbar">
      <select class="inp" id="r_range" style="width:150px" onchange="Views.rangePreset()"><option value="">Custom</option><option value="tm">This month</option><option value="lm">Last month</option><option value="ty">This year</option><option value="l1">Last 1 year</option><option value="l2">Last 2 years</option></select>
      <label class="fl" style="margin:0">From</label><input class="inp" type="date" id="r_from" value="${first}" style="width:150px">
      <label class="fl" style="margin:0">To</label><input class="inp" type="date" id="r_to" value="${todayISO()}" style="width:150px">
      <select class="inp" id="r_branch" style="width:160px"><option value="">All branches</option>${branchOptions('')}</select>
      <button class="btn primary" onclick="Views.runReport()">Run</button></div></div>
    <div class="pb" id="rOut"></div></div>`;
  Views.runReport();
};
Views.rangePreset=function(){const v=$('#r_range').value;const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const iso=d=>{const off=d.getTimezoneOffset();return new Date(d-off*60000).toISOString().slice(0,10);};
  let f,t;
  if(v==='tm'){f=iso(new Date(y,m,1));t=iso(new Date(y,m+1,0));}
  else if(v==='lm'){f=iso(new Date(y,m-1,1));t=iso(new Date(y,m,0));}
  else if(v==='ty'){f=iso(new Date(y,0,1));t=iso(new Date(y,11,31));}
  else if(v==='l1'){f=daysAgoISO(365);t=todayISO();}
  else if(v==='l2'){f=daysAgoISO(730);t=todayISO();}
  else return;
  $('#r_from').value=f;$('#r_to').value=t;Views.runReport();
};
Views.runReport=function(){
  const from=$('#r_from').value,to=$('#r_to').value,br=$('#r_branch').value;
  const inb=d=>(!br||d.branchId===br);
  const inv=State.documents.filter(d=>d.type==='invoice'&&d.date>=from&&d.date<=to&&inb(d));
  let sales=0,tax=0,disc=0;inv.forEach(d=>{const t=docTotals(d);sales+=t.grand;tax+=t.tax;disc+=t.disc;});
  let recv=0;State.documents.forEach(d=>{if(d.type!=='invoice'||!inb(d))return;(d.payments||[]).forEach(p=>{const pd=(p.date||'').slice(0,10);if(pd>=from&&pd<=to)recv+=Number(p.amount)||0;});});
  const pos=State.purchases.filter(p=>p.date>=from&&p.date<=to&&inb(p));
  let purchases=0;pos.forEach(p=>purchases+=purchTotals(p).grand);
  let supPaid=0;State.purchases.forEach(p=>{if(!inb(p))return;(p.payments||[]).forEach(x=>{const pd=(x.date||'').slice(0,10);if(pd>=from&&pd<=to)supPaid+=Number(x.amount)||0;});});
  const exps=State.expenses.filter(e=>e.date>=from&&e.date<=to&&inb(e));const expense=exps.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const receivable=State.documents.filter(d=>d.type==='invoice'&&inb(d)).reduce((s,d)=>s+Math.max(0,docTotals(d).balance),0);
  const payable=State.purchases.filter(inb).reduce((s,p)=>s+Math.max(0,purchTotals(p).balance),0);
  const fixedCost=fixedCostForRange(from,to,br);
  const netBilled=sales-purchases-expense;const netCash=recv-supPaid-expense;
  // sales by category
  const catMap={};inv.forEach(d=>d.items.forEach(it=>{const p=State.products.find(x=>x.id===it.productId);const cat=p?p.category:'Other/Custom';catMap[cat]=(catMap[cat]||0)+lineAmount(it);}));
  const catRows=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right">${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="muted center">No sales</td></tr>';
  const invRows=[...inv].sort((a,b)=>a.date.localeCompare(b.date)).map(d=>{const t=docTotals(d);return `<tr style="cursor:pointer" onclick="Views.viewDoc('${d.id}')"><td><b>${esc(d.no)}</b></td><td>${fmtDate(d.date)}</td><td>${esc(d.customerName)}</td><td class="right">${money(t.grand)}</td><td class="right">${money(t.paid)}</td><td class="right">${t.balance>0?money(t.balance):'-'}</td></tr>`;}).join('');
  const netColor=v=>v>=0?'green':'red';
  $('#rOut').innerHTML=`
    <div class="cards">
      <div class="kpi green"><div class="lbl">Sales (billed)</div><div class="val">${money(sales)}</div></div>
      <div class="kpi blue"><div class="lbl">Payments Received</div><div class="val">${money(recv)}</div></div>
      <div class="kpi navy"><div class="lbl">Purchases (billed)</div><div class="val">${money(purchases)}</div></div>
      <div class="kpi purple"><div class="lbl">Expenses</div><div class="val">${money(expense)}</div></div>
    </div>
    <div class="panel" style="box-shadow:none;border:1px solid var(--line)"><div class="ph"><h3>💰 Profit / Loss for period</h3><span class="muted">${fmtDate(from)} → ${fmtDate(to)}${br?' · '+esc(branchName(br)):''}</span></div>
      <div class="pb"><div class="grid2">
        <div><table>
          <tr><td>Sales (billed)</td><td class="right">${money(sales)}</td></tr>
          <tr><td>− Purchases (stock bought)</td><td class="right">${money(purchases)}</td></tr>
          <tr><td>− Expenses</td><td class="right">${money(expense)}</td></tr>
          <tr class="g" style="font-weight:800;border-top:2px solid var(--line)"><td>Net Profit (billed basis)</td><td class="right" style="color:var(--${netColor(netBilled)})">${money(netBilled)}</td></tr>
          ${fixedCost?`<tr><td>− Fixed monthly expenses <span class="hint">(months in range)</span></td><td class="right">${money(fixedCost)}</td></tr><tr style="font-weight:800"><td>Net after fixed expenses</td><td class="right" style="color:var(--${netColor(netBilled-fixedCost)})">${money(netBilled-fixedCost)}</td></tr>`:''}
        </table></div>
        <div><table>
          <tr><td>Cash received</td><td class="right">${money(recv)}</td></tr>
          <tr><td>− Paid to suppliers</td><td class="right">${money(supPaid)}</td></tr>
          <tr><td>− Expenses</td><td class="right">${money(expense)}</td></tr>
          <tr class="g" style="font-weight:800;border-top:2px solid var(--line)"><td>Net Cash Flow</td><td class="right" style="color:var(--${netColor(netCash)})">${money(netCash)}</td></tr>
          ${fixedCost?`<tr><td>− Fixed monthly expenses</td><td class="right">${money(fixedCost)}</td></tr><tr style="font-weight:800"><td>Cash flow after fixed expenses</td><td class="right" style="color:var(--${netColor(netCash-fixedCost)})">${money(netCash-fixedCost)}</td></tr>`:''}
        </table></div>
      </div>
      <div style="display:flex;gap:20px;margin-top:14px;flex-wrap:wrap">
        <div class="pill due" style="padding:8px 14px">To receive from customers: <b>${money(receivable)}</b></div>
        <div class="pill" style="background:#eef1f8;color:var(--navy);padding:8px 14px">To pay suppliers: <b>${money(payable)}</b></div>
      </div></div></div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div style="flex:2;min-width:320px"><h4>Invoices in range (${inv.length})</h4><table><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th class="right">Total</th><th class="right">Recvd</th><th class="right">Balance</th></tr></thead><tbody>${invRows||'<tr><td colspan="6" class="muted center" style="padding:24px">No invoices</td></tr>'}</tbody></table></div>
      <div style="flex:1;min-width:220px"><h4>Sales by category</h4><table><thead><tr><th>Category</th><th class="right">Amount</th></tr></thead><tbody>${catRows}</tbody></table></div>
    </div>`;
};

Views.saveUser=async function(id){
  const name=$('#u_name').value.trim(),username=$('#u_user').value.trim().toLowerCase();
  if(!username){toast('Enter a username');return;}
  if(State.users.some(x=>x.username.toLowerCase()===username&&x.id!==id)){toast('Username already exists');return;}
  const prev=id?State.users.find(x=>x.id===id):null;
  const role=$('#u_role').value;let perms=role==='admin'?allPerms(true):{};
  if(role!=='admin')document.querySelectorAll('.perm:checked').forEach(c=>perms[c.value]=true);
  const pass=$('#u_pass').value;
  if(!id&&!pass){toast('Set a password');return;}
  const rec={id:id||uid(),name:name||username,username,role,perms,active:$('#u_active').checked,
    pass:pass?hashPass(pass):(prev?prev.pass:hashPass('1234')),createdAt:prev?.createdAt||Date.now()};
  await DB.put('users',rec);await loadAll();
  if(State.currentUser&&State.currentUser.id===rec.id){State.currentUser=rec;buildNav();}
  Modal.close();Views.users();toast('User saved');
};
Views.delUser=async function(id){const u=State.users.find(x=>x.id===id);if(u.username==='admin'){toast('Cannot delete owner');return;}
  if(id===State.currentUser.id){toast('Cannot delete yourself');return;}
  if(!confirm('Delete user '+u.username+'?'))return;await DB.del('users',id);await loadAll();Views.users();toast('User deleted');};

  if(!list.length){$('#galGrid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">🎨</div>No designs here yet. Click <b>Add Photo</b> to add your own.</div>`;return;}
  $('#galGrid').innerHTML=list.map((g,i)=>`<div class="gal-card" onclick="Views.lightbox(${i})"><button class="del" onclick="event.stopPropagation();Views.delPhoto('${g.id}')">×</button><div class="imgwrap"><img loading="lazy" src="${g.img}" alt=""></div><div class="cap"><b>${esc(g.title||'Design')}</b><span>${esc(g.category||'')}</span></div></div>`).join('');
};
Views.addPhoto=function(){
  const cats=[...new Set(State.gallery.map(g=>g.category||'Other'))];
  Modal.open(`<div class="mh"><h3>Add Design Photo</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><div class="field"><label class="fl">Choose image from this computer</label><input class="inp" type="file" id="g_file" accept="image/*" onchange="Views.previewPhoto()"></div>
    <div id="g_preview" style="text-align:center;margin:10px 0"></div>
    <div class="grid2"><div class="field"><label class="fl">Title</label><input class="inp" id="g_title" placeholder="e.g. Main Door Design"></div>
    <div class="field"><label class="fl">Category</label><input class="inp" id="g_cat" list="gcats" value="Doors"><datalist id="gcats"><option>Doors</option><option>Kitchen</option><option>Ceiling</option><option>Almari</option><option>Media wall</option><option>Other</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div></div>
  </div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.savePhoto()">Save Photo</button></div>`);
};
Views.previewPhoto=function(){const f=$('#g_file').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{$('#g_preview').innerHTML=`<img src="${e.target.result}" style="max-height:180px;border-radius:8px">`;};r.readAsDataURL(f);};
Views.savePhoto=async function(){const f=$('#g_file').files[0];if(!f){toast('Choose an image');return;}
  const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});
  const img=await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.src=dataUrl;});
  const maxW=1100;const scale=Math.min(1,maxW/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);const out=c.toDataURL('image/jpeg',0.72);
  await DB.put('gallery',{id:uid(),title:$('#g_title').value.trim()||'Design',category:$('#g_cat').value.trim()||'Other',img:out,seeded:false,createdAt:Date.now()});
  await loadAll();Modal.close();Views.gallery();toast('Photo added');
};
Views.delPhoto=async function(id){if(!confirm('Remove this photo from the showcase?'))return;await DB.del('gallery',id);await loadAll();Views.renderGallery();toast('Removed');};
Views.lightbox=function(i){Views._lb=Views.galCurrent();Views._lbi=i;Views.renderLightbox();$('#lightbox').classList.add('on');};
Views.renderLightbox=function(){const g=Views._lb[Views._lbi];if(!g)return;
  $('#lightbox').innerHTML=`<button class="lb-x" onclick="Views.closeLightbox()">×</button>
    <button class="lb-nav prev" onclick="Views.lbMove(-1)">‹</button>
    <img src="${g.img}" alt="">
    <button class="lb-nav next" onclick="Views.lbMove(1)">›</button>
    <div class="lb-cap">${esc(g.title||'')}<small>${esc(g.category||'')} · ${Views._lbi+1} / ${Views._lb.length}</small></div>
    <div class="lb-tools"><button onclick="Views.toggleSlide()">${Views._slideTimer?'⏸ Pause':'▶ Play'}</button><button onclick="Views.closeLightbox()">Close</button></div>`;
};
Views.lbMove=function(d){Views._lbi=(Views._lbi+d+Views._lb.length)%Views._lb.length;Views.renderLightbox();};
Views.closeLightbox=function(){$('#lightbox').classList.remove('on');if(Views._slideTimer){clearInterval(Views._slideTimer);Views._slideTimer=null;}};
Views.slideshow=function(){const l=Views.galCurrent();if(!l.length){toast('No designs to show');return;}Views.lightbox(0);Views.toggleSlide();};
Views.toggleSlide=function(){if(Views._slideTimer){clearInterval(Views._slideTimer);Views._slideTimer=null;}else{Views._slideTimer=setInterval(()=>Views.lbMove(1),3000);}Views.renderLightbox();};
document.addEventListener('keydown',e=>{if(!$('#lightbox').classList.contains('on'))return;if(e.key==='Escape')Views.closeLightbox();if(e.key==='ArrowRight')Views.lbMove(1);if(e.key==='ArrowLeft')Views.lbMove(-1);});

Views.orders=function(){
  $('#content').innerHTML=`<div class="panel"><div class="ph"><h3>Order Tracking</h3><div class="searchbar">
    <input class="inp" id="oSearch" placeholder="Search no. or customer..." oninput="Views.renderOrders()">
    <select class="inp" id="oBranch" style="width:160px" onchange="Views.renderOrders()"><option value="">All branches</option>${branchOptions('')}</select>
    <label class="fl" style="margin:0"><input type="checkbox" id="oShowDel" onchange="Views.renderOrders()"> show delivered</label></div></div>
    <div class="pb"><p class="hint" style="margin:0 0 12px">Drag a card between columns, or use the dropdown, to update an order's progress. Orders come from invoices.</p><div class="kanban" id="board"></div></div></div>`;
  Views.renderOrders();
};
Views.renderOrders=function(){
  const q=($('#oSearch')?.value||'').toLowerCase(),br=$('#oBranch')?.value||'',showDel=$('#oShowDel')?.checked;
  const board=$('#board');if(!board)return;
  let inv=State.documents.filter(d=>d.type==='invoice'&&(!q||(d.no||'').toLowerCase().includes(q)||(d.customerName||'').toLowerCase().includes(q))&&(!br||d.branchId===br));
  board.innerHTML=ORDER_STAGES.map(st=>{
    let items=inv.filter(d=>(d.orderStatus||'pending')===st.k);
    if(st.k==='delivered'&&!showDel)items=items.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,15);
    else items=items.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const cards=items.map(d=>{const tt=docTotals(d);
      return `<div class="kcard" draggable="true" ondragstart="Views.dragStart(event,'${d.id}')" onclick="if(event.target.tagName!=='SELECT')Views.viewDoc('${d.id}')">
        <b>${esc(d.no)}</b> · ${esc(d.customerName||'Walk-in')}
        <div class="meta">${fmtDate(d.date)} · ${esc(branchName(d.branchId))}<br>${money(tt.grand)} ${tt.balance>0?`· <span class="bal">Bal ${money(tt.balance)}</span>`:'· <span style="color:var(--green)">Paid</span>'}</div>
        <select onchange="Views.setStage('${d.id}',this.value)">${ORDER_STAGES.map(s=>`<option value="${s.k}" ${s.k===(d.orderStatus||'pending')?'selected':''}>${s.label}</option>`).join('')}</select>
      </div>`;}).join('');
    return `<div class="kcol" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="Views.dropStage(event,'${st.k}')">
      <h4><span class="pill ${st.cls}">${st.label}</span><span class="cnt">${items.length}</span></h4>${cards||'<div class="muted" style="font-size:12px;text-align:center;padding:14px 0">—</div>'}</div>`;
  }).join('');
};
Views.dragStart=function(e,id){e.dataTransfer.setData('text/plain',id);};
Views.dropStage=function(e,stage){e.preventDefault();const id=e.dataTransfer.getData('text/plain');Views.setStage(id,stage);};
Views.setStage=async function(id,stage){const d=State.documents.find(x=>x.id===id);if(!d)return;if((d.orderStatus||'pending')===stage){Views.renderOrders();return;}
  d.orderStatus=stage;d.statusLog=d.statusLog||[];d.statusLog.push({status:stage,date:todayISO()});
  await DB.put('documents',d);await loadAll();Views.renderOrders();toast('Order '+d.no+' → '+stageOf(stage).label);};

/* Bill data in one place, used by the printed page (desktop) and the Android PDF. */
function billModel(d){const s=State.settings;const tt=docTotals(d);
  const br=(s.branches||[]).find(b=>b.id===d.branchId)||{name:s.shopName,phone:'',address:''};
  return {type:d.type,title:d.type==='quote'?'QUOTATION':'INVOICE',no:d.no,date:fmtDate(d.date),fromQuote:d.fromQuote||'',note:d.note||'',
    shopName:s.shopName||'Pehlwania Door Max',tagline:s.tagline||'',branch:{name:br.name||'',phone:br.phone||'',address:br.address||''},
    customerName:d.customerName||'Walk-in Customer',customerPhone:d.customerPhone||'',currency:s.currency||'Rs',
    items:d.items.map((it,i)=>({n:i+1,desc:it.desc||'',size:sizeText(it),area:it.basis==='sqft'&&lineArea(it)?fmtArea(lineArea(it)*(Number(it.qty)||0))+' sq ft':'',
      qty:`${it.qty} ${it.unit||''}`.trim(),rate:fmt(it.rate)+(it.basis==='sqft'?'/ft²':''),amount:fmt(lineAmount(it))})),
    sub:fmt(tt.sub),disc:tt.disc?fmt(tt.disc):'',tax:tt.tax?fmt(tt.tax):'',taxPct:d.taxPct||0,grand:fmt(tt.grand),paid:fmt(tt.paid),balance:fmt(tt.balance),
    balanceNum:tt.balance,words:toWords(tt.grand),terms:s.terms||'',fileName:`${d.no}-${(d.customerName||'customer').replace(/[^a-z0-9]+/gi,'_')}.pdf`};}
function waPhone(p){let d=String(p||'').replace(/[^0-9+]/g,'');if(d.startsWith('+'))d=d.slice(1);if(d.startsWith('00'))d=d.slice(2);
  if(d.length===11&&d.startsWith('03'))d='92'+d.slice(1);if(d.length===10&&d.startsWith('3'))d='92'+d;return d.length>=10?d:'';}
