/* =========================================================
   BACKUP & RESTORE  (format v3, also reads the original v2 files)
   ---------------------------------------------------------
   v3 file = {
     format:"pehlwania-pos-backup", formatVersion:3, app, appVersion, source,
     createdAt, schemaVersion, counts:{store:n}, totals:{invoiceGrand, payments},
     payloadSha256, payload:"<JSON text of {store:[records]}>"   }
   The payload is kept as exact text so its SHA-256 checksum is identical on
   Android and desktop. A PDF bill is NOT a backup.
   ========================================================= */
const BACKUP_FORMAT='pehlwania-pos-backup',BACKUP_VERSION=3,APP_VERSION='3.0.0';
/* small pure-JS SHA-256 (works on file:// pages and in tests) */
function sha256Hex(str){
  const bytes=new TextEncoder().encode(str);const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length,withPad=((l+9+63)>>6)<<6;const m=new Uint8Array(withPad);m.set(bytes);m[l]=0x80;
  const bl=l*8;const dv=new DataView(m.buffer);dv.setUint32(withPad-4,bl>>>0);dv.setUint32(withPad-8,Math.floor(bl/4294967296));
  const W=new Uint32Array(64);const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<withPad;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3),s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+W[i])>>>0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0);}
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');}

function backupTotals(data){let invoiceGrand=0,payments=0;
  (data.documents||[]).forEach(d=>{if(d&&d.type==='invoice'){const t=docTotals(d);invoiceGrand+=t.grand;payments+=t.paid;}});
  return {invoiceGrand:Math.round(invoiceGrand*100)/100,payments:Math.round(payments*100)/100};}

/* Validate a parsed backup file. Never touches the database. */
function validateBackup(obj){
  const res={ok:false,errors:[],warnings:[],format:'',createdAt:'',counts:{},data:null};
  if(!obj||typeof obj!=='object'||Array.isArray(obj)){res.errors.push('Not a backup file (not a JSON object).');return res;}
  let data;
  if(obj.format===BACKUP_FORMAT){
    res.format='v'+obj.formatVersion;res.createdAt=obj.createdAt||'';
    if(!(obj.formatVersion>=3)){res.errors.push('Unknown backup version.');return res;}
    if(obj.formatVersion>BACKUP_VERSION){res.errors.push(`This backup was made by a newer app version (format ${obj.formatVersion}). Please update the app first.`);return res;}
    if(typeof obj.payload!=='string'){res.errors.push('Backup payload is missing.');return res;}
    if(sha256Hex(obj.payload)!==obj.payloadSha256){res.errors.push('Checksum mismatch — the file is damaged or was edited. It will not be restored.');return res;}
    try{data=JSON.parse(obj.payload);}catch(e){res.errors.push('Backup payload is not valid JSON.');return res;}
  }else if(obj._app==='PehlwaniaDoorMaxPOS'){
    res.format='v'+(obj._version||1)+' (original desktop app)';res.createdAt=obj.exportedAt||'';data={};
    DB.STORES.forEach(s=>{if(s in obj)data[s]=obj[s];});
    res.warnings.push('Older backup format without a checksum — it is checked record by record instead.');
  }else{res.errors.push('This file is not a Pehlwania POS backup.');return res;}
  if(!data||typeof data!=='object'){res.errors.push('Backup has no data.');return res;}
  const num=v=>v===''||v==null||Number.isFinite(Number(v));
  const ids={};
  for(const s of DB.STORES){const rows=data[s]==null?[]:data[s];
    if(!Array.isArray(rows)){res.errors.push(`"${s}" is not a list.`);continue;}
    const seen=new Set();
    rows.forEach((r,i)=>{if(!r||typeof r!=='object'){res.errors.push(`${s} #${i+1} is not a record.`);return;}
      if(typeof r.id!=='string'||!r.id.trim()){res.errors.push(`${s} #${i+1} has no ID.`);return;}
      if(seen.has(r.id))res.errors.push(`${s}: duplicate ID ${r.id}.`);seen.add(r.id);});
    ids[s]=seen;res.counts[s]=rows.length;data[s]=rows;}
  if(!ids.settings||!ids.settings.has('app'))res.errors.push('Business settings are missing.');
  const itemIds=new Set(),payIds=new Set();
  (data.documents||[]).forEach(d=>{if(!d||!d.id)return;const tag=(d.no||d.id);
    if(d.type!=='invoice'&&d.type!=='quote')res.errors.push(`${tag}: unknown document type.`);
    if(!d.no)res.errors.push(`Document ${d.id} has no number.`);
    if(!Array.isArray(d.items))res.errors.push(`${tag}: items missing.`);
    else d.items.forEach(it=>{if(!it||typeof it!=='object'){res.errors.push(`${tag}: bad item.`);return;}
      if(!num(it.qty)||!num(it.rate)||!num(it.width)||!num(it.height))res.errors.push(`${tag}: an item has a non-numeric value.`);
      if(Number(it.rate)<0||Number(it.qty)<0)res.errors.push(`${tag}: negative rate or quantity.`);
      if(it.id){if(itemIds.has(it.id))res.errors.push(`${tag}: duplicate item ID ${it.id}.`);itemIds.add(it.id);}});
    if(d.payments!=null&&!Array.isArray(d.payments))res.errors.push(`${tag}: payments are not a list.`);
    (d.payments||[]).forEach(p=>{if(!p||!num(p.amount)||!(Number(p.amount)>0))res.errors.push(`${tag}: invalid payment amount.`);
      if(p&&p.id){if(payIds.has(p.id))res.errors.push(`${tag}: duplicate payment ID ${p.id}.`);payIds.add(p.id);}});
    if(!num(d.discount)||!num(d.taxPct))res.errors.push(`${tag}: invalid discount or tax.`);
    if(d.customerId&&ids.customers&&!ids.customers.has(d.customerId))res.warnings.push(`${tag}: linked customer not found (the name on the bill is kept).`);});
  (data.purchases||[]).forEach(p=>{if(p&&p.supplierId&&ids.suppliers&&!ids.suppliers.has(p.supplierId))res.warnings.push(`${p.no||p.id}: supplier not found.`);
    (p&&p.payments||[]).forEach(x=>{if(!num(x.amount)||!(Number(x.amount)>0))res.errors.push(`${p.no||p.id}: invalid supplier payment.`);});});
  (data.expenses||[]).forEach(e=>{if(!num(e.amount)||Number(e.amount)<0)res.errors.push(`Expense ${e.id}: invalid amount.`);});
  if(!(data.users||[]).some(u=>u.role==='admin'&&u.active!==false))res.warnings.push('No active owner login in this backup — the default admin/admin login will be recreated.');
  res.data=data;res.ok=res.errors.length===0;
  if(res.errors.length>20){const n=res.errors.length;res.errors=res.errors.slice(0,20);res.errors.push(`…and ${n-20} more problems.`);}
  return res;}

async function buildBackupFile(source){
  const data={};for(const s of DB.STORES)data[s]=await DB.getAll(s);
  const payload=JSON.stringify(data);const counts={};DB.STORES.forEach(s=>counts[s]=data[s].length);
  return JSON.stringify({format:BACKUP_FORMAT,formatVersion:BACKUP_VERSION,app:'PehlwaniaDoorMaxPOS',appVersion:APP_VERSION,source,
    createdAt:new Date().toISOString(),counts,totals:backupTotals(data),payloadSha256:sha256Hex(payload),payload});}

const Backup=(()=>{
  async function getStatus(){if(IS_NATIVE)return PDMNative.call('backup.status');return (await DB.get('settings','backupStatus'))||{id:'backupStatus'};}
  async function setStatus(patch){const st=Object.assign({id:'backupStatus'},await getStatus(),patch);await DB.put('settings',st);}
  function download(text,name){const blob=new Blob([text],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  async function export_(){
    if(IS_NATIVE){toast('Preparing backup…');
      try{const r=await PDMNative.call('backup.export');
        if(r&&r.cancelled){toast('Backup cancelled — nothing was saved');return;}
        toast(`✔ Backup saved and verified: ${r.fileName}`);}
      catch(e){toast('⚠ Backup failed: '+e.message);}
      if($('#bkStatus'))Views.sync();return;}
    const name='PehlwaniaPOS-backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
    try{const text=await buildBackupFile('desktop');
      const v=validateBackup(JSON.parse(text)); /* verify before reporting success */
      if(!v.ok)throw new Error(v.errors[0]);
      download(text,name);
      const recs=Object.values(v.counts).reduce((a,b)=>a+b,0);
      await setStatus({lastSuccessAt:new Date().toISOString(),fileName:name,location:'Your browser\'s Downloads folder',sizeBytes:text.length,format:BACKUP_FORMAT+' v'+BACKUP_VERSION,records:recs,counts:v.counts,lastResult:'success',lastError:''});
      toast('✔ Backup file created and verified ('+recs+' records). Keep it safe.');}
    catch(e){await setStatus({lastResult:'failed',lastError:String(e.message||e),lastAttemptAt:new Date().toISOString()}).catch(()=>{});toast('⚠ Backup failed: '+(e.message||e));}
    if($('#bkStatus'))Views.sync();}
  /* show what is inside the file and ask for confirmation */
  function confirmRestore(info,onYes){
    const cnt=info.counts||{};const rows=Object.keys(cnt).filter(k=>cnt[k]).map(k=>`<tr><td>${esc(k)}</td><td class="right">${cnt[k]}</td></tr>`).join('');
    Modal.open(`<div class="mh"><h3>${info.ok?'Restore this backup?':'Backup cannot be restored'}</h3><button class="x" onclick="Modal.close()">×</button></div>
    <div class="mb"><p><b>Format:</b> ${esc(info.format||'')} &nbsp; <b>Created:</b> ${info.createdAt?esc(new Date(info.createdAt).toLocaleString('en-GB')):'unknown'}</p>
      ${info.errors&&info.errors.length?`<div class="alert err"><b>Problems found — nothing has been changed:</b><ul>${info.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
      ${info.warnings&&info.warnings.length?`<div class="alert warn"><b>Notes:</b><ul>${info.warnings.slice(0,10).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
      ${rows?`<table><thead><tr><th>Records in backup</th><th class="right">Count</th></tr></thead><tbody>${rows}</tbody></table>`:''}
      ${info.ok?`<div class="alert warn" style="margin-top:12px"><b>Full restore replaces ALL current data on this device</b> (customers, invoices, payments, expenses, products, settings, logins). A safety backup of the current data is made first.</div>
      <label class="fl" style="margin-top:10px"><input type="checkbox" id="rs_ok"> I understand — replace all current data with this backup</label>`:''}</div>
    <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button>${info.ok?`<button class="btn danger" id="rs_go">Restore Backup</button>`:''}</div>`,true);
    if(info.ok)$('#rs_go').onclick=()=>{if(!$('#rs_ok').checked){toast('Tick the box to confirm');return;}Modal.close();onYes();};}
  async function pick(){
    if(IS_NATIVE){try{const info=await PDMNative.call('backup.pick');if(!info||info.cancelled)return;
        confirmRestore(info,async()=>{toast('Restoring… please wait');
          try{const r=await PDMNative.call('backup.restore',{token:info.token});
            alert(`Restore complete and verified.\n\n${r.records} records restored. Safety backup of the previous data: ${r.safetyBackup}`);location.reload();}
          catch(e){alert('Restore failed — your previous data was kept.\n\n'+e.message);}});}
      catch(e){toast('⚠ '+e.message);}return;}
    document.getElementById('restoreFile').click();}
  async function restore(file){
    let info;try{info=validateBackup(JSON.parse(await file.text()));}catch(e){info={ok:false,errors:['Could not read the file: '+e.message],warnings:[],counts:{}};}
    confirmRestore(info,async()=>{
      try{toast('Saving a safety backup of current data first…');
        const safety=await buildBackupFile('desktop-safety');download(safety,'PehlwaniaPOS-SAFETY-before-restore-'+todayISO()+'.json');
        const data=info.data;
        await DB.tx(async()=>{for(const s of DB.STORES){await DB.clear(s);for(const rec of (data[s]||[]))await DB.put(s,rec);}
          await DB.put('settings',Object.assign({},(await DB.get('settings','backupStatus'))||{id:'backupStatus'},{lastRestoreAt:new Date().toISOString()}));});
        DB.invalidate();
        for(const s of DB.STORES){const n=(await DB.getAll(s)).filter(r=>!(s==='settings'&&r.id==='backupStatus')).length;
          const exp=(data[s]||[]).filter(r=>!(s==='settings'&&r.id==='backupStatus')).length;
          if(n!==exp)throw new Error(`Verification failed for ${s}: expected ${exp}, found ${n}. Restore the safety backup that was just downloaded.`);}
        alert('Restore complete and verified.');location.reload();}
      catch(e){alert('Restore failed: '+e.message+'\n\nIf data looks wrong, restore the SAFETY backup file that was downloaded.');location.reload();}});}
  async function wipe(){if(!confirm('Permanently ERASE all data?'))return;if(!confirm('Last warning — erase everything? Make a backup first!'))return;
    if(IS_NATIVE){try{await PDMNative.call('db.wipe');}catch(e){toast('⚠ '+e.message);return;}location.reload();return;}
    await DB.tx(async()=>{for(const s of DB.STORES)await DB.clear(s);});location.reload();}
  return{export:export_,pick,restore,wipe,getStatus,confirmRestore};
})();
document.getElementById('restoreFile').addEventListener('change',e=>{if(e.target.files[0])Backup.restore(e.target.files[0]);e.target.value='';});

function fmtWhen(iso){if(!iso)return 'Never';const d=new Date(iso);if(isNaN(d))return esc(iso);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtBytes(n){if(!n)return '-';return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
Views.sync=async function(){
  const bs=await Backup.getStatus().catch(()=>({}));

    <div class="pb" id="bkStatus"><div class="kv">
      <div><span>Last successful backup</span><b>${fmtWhen(bs.lastSuccessAt)}</b></div>
      <div><span>File</span><b>${esc(bs.fileName||'-')}</b></div>
      <div><span>Location</span><b>${esc(bs.location||'-')}</b></div>
      <div><span>Size</span><b>${fmtBytes(bs.sizeBytes)}</b></div>
      <div><span>Format</span><b>${esc(bs.format||'-')}</b></div>
      <div><span>Records included</span><b>${bs.records!=null?bs.records:'-'}</b></div>
      <div><span>Last result</span><b>${bs.lastResult==='success'?'<span class="pill paid">Success</span>':bs.lastResult==='failed'?'<span class="pill due">Failed</span>':'-'}</b></div>
      ${bs.lastError?`<div><span>Most recent error</span><b style="color:var(--red)">${esc(bs.lastError)}</b></div>`:''}
      ${bs.lastRestoreAt?`<div><span>Last restore</span><b>${fmtWhen(bs.lastRestoreAt)}</b></div>`:''}
    </div>
    <p class="hint">A backup contains everything: customers, invoices &amp; quotations with items and agreed rates, payments, products &amp; rate history, purchases, expenses, fixed expenses, stock log, showcase photos, settings and logins. A PDF bill is not a backup. Google Sheets is a report copy, not a backup.</p>
    ${IS_NATIVE?'<p class="hint">⚠ If the app is uninstalled or its data is cleared, everything stored on this phone is deleted. Only a backup file (kept off the phone, e.g. Google Drive or WhatsApp to yourself) can bring it back.</p>':''}</div></div>`;
  if(!IS_NATIVE){
    html+=`<div class="panel"><div class="ph"><h3>📊 Google Sheets Sync</h3></div><div class="pb"><p class="muted">Google Sheets sync and Google Drive backup are available in the <b>Android app</b>. On this computer, use <b>Backup Data</b> and restore the file in the Android app (or another PC) to move data.</p></div></div>`;
    $('#content').innerHTML=html;return;}
  let st={};try{st=await PDMNative.call('sync.status');}catch(e){st={error:e.message};}
  const badge=s=>({ok:'<span class="pill paid">Connected</span>',not_connected:'<span class="pill due">Not connected</span>',auth_error:'<span class="pill due">Sign-in needed</span>',permission_error:'<span class="pill due">No permission</span>',spreadsheet_missing:'<span class="pill due">Spreadsheet unavailable</span>',schema_error:'<span class="pill due">Sheet columns changed</span>',not_configured:'<span class="pill part">Google not set up</span>',no_spreadsheet:'<span class="pill part">Choose a spreadsheet</span>',syncing:'<span class="pill quote">Syncing…</span>',error:'<span class="pill part">Last sync failed</span>'}[s]||`<span class="pill part">${esc(s||'-')}</span>`);
  html+=`<div class="panel"><div class="ph"><h3>📊 Google Sheets Sync</h3><div>
      ${st.accountEmail?`<button class="btn primary" onclick="Views.syncNow()">⟳ Sync Now</button> <button class="btn" onclick="Views.syncCall('sync.retryFailed','Retrying failed records')">Retry failed</button>`:`<button class="btn primary" onclick="Views.syncCall('sync.connect','Connecting Google account')">Connect Google Account</button>`}</div></div>
    <div class="pb"><div class="kv">
      <div><span>Status</span><b>${badge(st.state)}</b></div>
      <div><span>Google account</span><b>${esc(st.accountEmail||'Not connected')}</b></div>
      <div><span>Spreadsheet</span><b>${st.spreadsheetId?`${esc(st.spreadsheetTitle||st.spreadsheetId)} ${st.spreadsheetUrl?`<a href="#" onclick="PDMNative.call('app.openUrl',{url:'${esc(st.spreadsheetUrl)}'});return false;">open</a>`:''}`:'Not selected'}</b></div>
      <div><span>Internet</span><b>${st.online?'Online':'Offline'}</b></div>
      <div><span>Last successful sync</span><b>${fmtWhen(st.lastSuccessAt)}</b></div>
      <div><span>Waiting to sync</span><b>${st.pending||0}</b></div>
      <div><span>Failed</span><b style="color:${st.failed?'var(--red)':'inherit'}">${st.failed||0}</b></div>
      <div><span>Conflicts</span><b style="color:${st.conflicts?'var(--red)':'inherit'}">${st.conflicts||0}</b></div>
    </div>
    ${st.lastError?`<div class="alert err" style="margin-top:10px"><b>Last error:</b> ${esc(st.lastError)}</div>`:''}
    ${st.state==='not_configured'?`<div class="alert warn" style="margin-top:10px">Google sign-in is not set up for this app yet. The shop owner/developer must complete the Google Cloud setup in <b>docs/GOOGLE_SETUP.md</b> (Android OAuth client with package <code>${esc(st.packageName||'')}</code> and SHA-1 <code>${esc(st.sha1||'')}</code>). Everything else works offline.</div>`:''}
    ${st.accountEmail?`<div class="btnrow">
      ${st.spreadsheetId?'':`<button class="btn primary" onclick="Views.syncCall('sync.createSpreadsheet','Creating spreadsheet')">Create new spreadsheet</button>`}
      <button class="btn" onclick="Views.useSheet()">${st.spreadsheetId?'Switch spreadsheet':'Use existing spreadsheet'}</button>
      ${st.conflicts?`<button class="btn danger" onclick="Views.resolveConflicts()">Resolve conflicts</button>`:''}
      <button class="btn" onclick="Views.syncLog()">Sync log</button>
      <button class="btn danger" onclick="Views.syncDisconnect()">Disconnect</button></div>`:''}
    <p class="hint">Every sale, payment and expense is saved on this phone first. Sync copies it to the spreadsheet when internet is available (on app open, when the app comes back, when internet returns, shortly after changes, or with Sync Now). Rows are matched by record ID, so nothing is duplicated.</p>
    ${(st.recentErrors||[]).length?`<h4 style="margin:12px 0 6px">Recent problems</h4><table><tbody>${st.recentErrors.map(e=>`<tr><td class="muted" style="white-space:nowrap">${fmtWhen(e.at)}</td><td>${esc(e.message)}</td></tr>`).join('')}</tbody></table>`:''}
    </div></div>`;
  let dr={};try{dr=await PDMNative.call('drive.status');}catch(e){dr={error:e.message};}
  html+=`<div class="panel"><div class="ph"><h3>☁️ Google Drive Backup (optional)</h3><div>${st.accountEmail?`<button class="btn navy" onclick="Views.driveBackup()">Back up to Drive now</button> <button class="btn" onclick="Views.driveRestore()">Restore from Drive</button>`:''}</div></div>
    <div class="pb"><div class="kv"><div><span>Last Drive backup</span><b>${fmtWhen(dr.lastSuccessAt)}</b></div><div><span>File</span><b>${esc(dr.fileName||'-')}</b></div>${dr.lastError?`<div><span>Most recent error</span><b style="color:var(--red)">${esc(dr.lastError)}</b></div>`:''}</div>
    <p class="hint">${st.accountEmail?'Uploads the same complete backup file to a "Pehlwania POS Backups" folder in your Google Drive.':'Connect a Google account above to use Drive backup.'}</p></div></div>`;

Views.syncCall=async function(method,label,args){toast(label+'…');try{const r=await PDMNative.call(method,args);if(r&&r.message)toast(r.message);}catch(e){toast('⚠ '+e.message);}Views.sync();};
Views.syncNow=async function(){toast('Syncing with Google Sheets…');try{const r=await PDMNative.call('sync.now');toast(r&&r.message||'Sync finished');}catch(e){toast('⚠ '+e.message);}Views.sync();};
Views.useSheet=function(){Modal.open(`<div class="mh"><h3>Use an existing spreadsheet</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><div class="field"><label class="fl">Spreadsheet link or ID</label><input class="inp" id="sh_id" placeholder="https://docs.google.com/spreadsheets/d/…"></div>
  <p class="hint">The signed-in Google account must have edit access. Missing tabs (Customers, Orders, Order Items, Payments, Products &amp; Rates, Daily Expenses, Fixed Monthly Expenses, Sync Log) are added; other tabs are not touched. If you switch spreadsheets, all records are uploaded to the new one, matched by ID.</p></div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.useSheetGo()">Connect spreadsheet</button></div>`);};
Views.useSheetGo=async function(){const v=$('#sh_id').value.trim();const m=v.match(/\/d\/([a-zA-Z0-9-_]+)/);const id=m?m[1]:v;if(!id){toast('Paste the spreadsheet link');return;}
  if(!confirm('Connect this spreadsheet and upload all records to it?'))return;Modal.close();Views.syncCall('sync.useSpreadsheet','Checking spreadsheet',{id});};
Views.resolveConflicts=function(){Modal.open(`<div class="mh"><h3>Resolve sync conflicts</h3><button class="x" onclick="Modal.close()">×</button></div>
  <div class="mb"><p>Some rows were edited directly in the spreadsheet after the app last wrote them. For bills and payments the app does <b>not</b> overwrite them automatically.</p>
  <p><b>Use this phone's data</b> overwrites those rows with the records stored on this phone (the phone is the main record).<br><b>Keep the sheet as is</b> leaves the rows unchanged and stops retrying them (the phone keeps its own data).</p>
  <div id="cfList" class="hint">Loading…</div></div>
  <div class="mf"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn" onclick="Views.resolveGo('keepSheet')">Keep the sheet as is</button><button class="btn danger" onclick="Views.resolveGo('useDevice')">Use this phone's data</button></div>`,true);
  PDMNative.call('sync.conflicts').then(l=>{$('#cfList').innerHTML=(l||[]).length?`<table><tbody>${l.map(c=>`<tr><td>${esc(c.entity)}</td><td class="muted">${esc(c.label||c.recordId)}</td><td class="muted">${esc(c.message||'')}</td></tr>`).join('')}</tbody></table>`:'No conflicts.';}).catch(e=>$('#cfList').textContent=e.message);};
Views.resolveGo=async function(mode){if(mode==='useDevice'&&!confirm('Overwrite the conflicting spreadsheet rows with this phone\'s data?'))return;Modal.close();Views.syncCall('sync.resolveConflicts','Resolving',{mode});};
Views.syncLog=async function(){let rows=[];try{rows=await PDMNative.call('sync.log',{limit:150});}catch(e){toast(e.message);return;}

Views.syncDisconnect=async function(){if(!confirm('Disconnect the Google account? Data on this phone is kept. Changes made while disconnected wait in the queue and upload after you reconnect.'))return;Views.syncCall('sync.disconnect','Disconnecting');};
Views.driveBackup=async function(){toast('Uploading backup to Google Drive…');try{const r=await PDMNative.call('drive.backup');toast('✔ Drive backup uploaded and verified: '+r.fileName);}catch(e){toast('⚠ Drive backup failed: '+e.message);}Views.sync();};
Views.driveRestore=async function(){let files=[];try{files=await PDMNative.call('drive.list');}catch(e){toast('⚠ '+e.message);return;}
