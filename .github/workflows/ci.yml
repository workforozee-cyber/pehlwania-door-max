name: CI — test, build & verify APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the APK to a GitHub Release on main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  desktop-web-tests:
    name: Shared UI tests (desktop mode, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Desktop single-file build is up to date
        run: python3 tools/build_desktop.py --check
      - name: Install Playwright
        working-directory: web-tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Run desktop end-to-end tests
        working-directory: web-tests
        run: |
          mkdir -p ../ci-out/desktop
          set -o pipefail
          node desktop_e2e.mjs 2>&1 | tee ../ci-out/desktop/desktop-e2e.log
      - name: Publish CI report branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: cp web-tests/last-results.json web-tests/last-phone-dashboard.png ci-out/desktop/ 2>/dev/null || true; bash ci/publish_report.sh desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: |
            web-tests/last-results.json
            web-tests/last-phone-dashboard.png

  android:
    name: Flutter analyze, unit tests, build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Free disk space (unused preinstalled toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/lib/android/sdk/emulator || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          mkdir -p ../ci-out/android
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../ci-out/android/analyze.log
      - name: Unit tests (SQLite, financial, backup/restore, Sheets sync)
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter test --reporter expanded --file-reporter json:test-results.json 2>&1 | tee ../ci-out/android/unit-tests.log
      - name: Release signing key (from repository secrets)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            # tolerate common paste mistakes: whitespace/newlines or the whole "STORE_PASSWORD=..." line
            PW=$(printf '%s' "$KS_PW_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]*(STORE_PASSWORD|KEY_PASSWORD)=//; s/^[[:space:]]+//; s/[[:space:]]+$//')
            echo "::add-mask::$PW"
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias pehlwania >/dev/null 2>&1; then
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "Release key present and password verified" | tee -a ci-out/android/signing.log
            else
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "Release key found but ANDROID_KEYSTORE_PASSWORD does not open it (length ${#PW}) — building DEBUG-signed" | tee -a ci-out/android/signing.log
              echo "::warning::ANDROID_KEYSTORE_PASSWORD does not open the keystore — APK will be DEBUG-signed."
            fi
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — the APK will be DEBUG-signed (test build only)."
          fi
      - name: Build release APK
        working-directory: app
        env:
          ANDROID_KEY_ALIAS: pehlwania
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../ci-out/android/build-release.log
      - name: Build CI test APK (WebView debugging on, for the emulator test only)
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --debug --target-platform android-x64 --dart-define=PDM_WEBVIEW_DEBUG=true 2>&1 | tee ../ci-out/android/build-ci-debug.log
      - name: Verify APK (exists, size, package, version, SDKs, signature)
        id: verify
        run: |
          set -e
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          "$BT/aapt2" dump badging "$APK" | grep -iE "^package:|sdkVersion|application-label:" | tee badging.txt
          "$BT/apksigner" verify --print-certs "$APK" | tee signature.txt
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then KIND=release; else KIND=debug-signed; fi
          VERSION=$(grep -o "versionName='[^']*'" badging.txt | cut -d"'" -f2)
          NAME="PehlwaniaPOS-v${VERSION}-${KIND}.apk"
          cp "$APK" "$NAME"
          cp "$NAME" badging.txt signature.txt ci-out/android/
          echo "$SHA  $NAME" > ci-out/android/SHA256SUMS.txt
          { echo "file=$NAME"; echo "size=$SIZE"; echo "sha256=$SHA"; echo "kind=$KIND"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
          { echo "## APK"; echo "- File: \`$NAME\` ($SIZE bytes)"; echo "- SHA-256: \`$SHA\`"; echo '```'; cat badging.txt signature.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            PehlwaniaPOS-*.apk
            badging.txt
            signature.txt
            app/test-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk-ci-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish CI report branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: cp app/test-results.json ci-out/android/ 2>/dev/null || true; bash ci/publish_report.sh android
      - name: Fail if analysis or tests failed
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "analyze=${{ steps.analyze.outcome }} tests=${{ steps.tests.outcome }}"
          exit 1
      - name: Publish to GitHub Release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pehlwania POS v${{ steps.verify.outputs.version }} (${{ steps.verify.outputs.kind }}) — build ${{ github.run_number }}
          prerelease: ${{ steps.sign.outputs.signed != 'true' }}
          body: |
            Android APK built by CI from ${{ github.sha }}.
            Build type: **${{ steps.verify.outputs.kind }}**
            SHA-256: `${{ steps.verify.outputs.sha256 }}`
            Desktop version: download `desktop/` from the repository.
          files: |
            ${{ steps.verify.outputs.file }}
            badging.txt
            signature.txt

  emulator:
    name: Install & run on Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk-ci-debug, path: ci-apk }
      - uses: actions/download-artifact@v4
        with: { name: apk, path: rel-apk }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright (Android driver)
        working-directory: web-tests
        run: npm install
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash -c 'set -o pipefail; bash ci/emulator_test.sh 2>&1 | tee emulator-run.log'
      - name: Publish CI report branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-out/emulator
          cp -r web-tests/android-results.json web-tests/android-shots emulator-logcat.txt emulator-logcat-e2e.txt emulator-run.log e2e-output.log ci-out/emulator/ 2>/dev/null || true
          bash ci/publish_report.sh emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            web-tests/android-results.json
            web-tests/android-shots/
            emulator-logcat.txt
