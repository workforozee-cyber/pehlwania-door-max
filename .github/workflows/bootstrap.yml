name: bootstrap-scaffold
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: Generate Android scaffold
        run: |
          flutter create --project-name pehlwania_pos --org com.pehlwania --platforms android --android-language kotlin app
          cd app
          flutter pub add webview_flutter webview_flutter_android sqflite path path_provider uuid crypto file_picker connectivity_plus http printing pdf url_launcher
          flutter pub add --dev sqflite_common_ffi
          flutter pub get
          flutter --version > ../FLUTTER_VERSION.txt
      - name: Commit to bootstrap branch
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b bootstrap
          git add -A app FLUTTER_VERSION.txt
          git commit -m "Generated Flutter Android scaffold"
          git push origin bootstrap
